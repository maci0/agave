<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 827.4585000000001 518" width="827.4585000000001" height="518" style="--bg:#ffffff;--fg:#2a2522;--line:#94908c;--accent:#c4823a;--muted:#75716f;--surface:#f1efec;--border:#9c938a;background:#ffffff">
<style>
  text { font-family: Inter, 'Adwaita Sans', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #2a2522;
    --_text-sec:      #75716f;
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          #94908c;
    --_arrow:         #504b47;
    --_node-fill:     #f1efec;
    --_node-stroke:   #9c938a;
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="#504b47" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="#504b47" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="loop" data-label="DDTree decode (per generation step)">
  <rect x="30" y="228" width="667.897" height="240" rx="0" ry="0" fill="none" stroke="#9c938a" stroke-width="1" />
  <rect x="30" y="228" width="242.70999999999995" height="18" fill="#f7f5f3" stroke="#9c938a" stroke-width="1" />
  <text x="36" y="237" font-size="11" font-weight="600" fill="#75716f" dy="3.8499999999999996">loop [DDTree decode (per generation step)]</text>
</g>
<line class="lifeline" data-actor="User" x1="80" y1="70" x2="80" y2="488" stroke="#94908c" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Scorer" x1="237.3665" y1="70" x2="237.3665" y2="488" stroke="#94908c" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Target" x1="431.35850000000005" y1="70" x2="431.35850000000005" y2="488" stroke="#94908c" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Draft" x1="617.9405" y1="70" x2="617.9405" y2="488" stroke="#94908c" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="User" data-to="Scorer" data-label="Full prompt (128K tokens)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="80" y1="90" x2="237.3665" y2="90" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="158.68325" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">Full prompt (128K tokens)</text>
</g>
<g class="message" data-from="Scorer" data-to="Target" data-label="Selected blocks only (~8K tokens)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="237.3665" y1="145" x2="431.35850000000005" y2="145" stroke="#94908c" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="334.3625" y="135" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">Selected blocks only (~8K tokens)</text>
</g>
<g class="message" data-from="Target" data-to="Draft" data-label="KV cache ready, begin decode" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="431.35850000000005" y1="200" x2="617.9405" y2="200" stroke="#94908c" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="524.6495" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">KV cache ready, begin decode</text>
</g>
<g class="message" data-from="Draft" data-to="Draft" data-label="Propose 5-token tree (~8ms)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="617.9405,268 647.9405,268 647.9405,288 617.9405,288" fill="none" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="655.9405" y="278" font-size="11" text-anchor="start" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">Propose 5-token tree (~8ms)</text>
</g>
<g class="message" data-from="Draft" data-to="Target" data-label="Tree of candidates" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="617.9405" y1="338" x2="431.35850000000005" y2="338" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="524.6495" y="328" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">Tree of candidates</text>
</g>
<g class="message" data-from="Target" data-to="Target" data-label="Verify batch in 1 pass (~65ms)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="431.35850000000005,378 461.35850000000005,378 461.35850000000005,398 431.35850000000005,398" fill="none" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="469.35850000000005" y="388" font-size="11" text-anchor="start" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">Verify batch in 1 pass (~65ms)</text>
</g>
<g class="message" data-from="Target" data-to="User" data-label="Accept ~3 tokens on average" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="431.35850000000005" y1="448" x2="80" y2="448" stroke="#94908c" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="255.67925000000002" y="438" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">Accept ~3 tokens on average</text>
</g>
<g class="note" data-position="over" data-actors="Scorer">
  <polygon points="137.2235,98 331.5095,98 337.5095,104 337.5095,121 137.2235,121" fill="#ffffff" stroke="#9c938a" stroke-width="0.75" />
  <polygon points="331.5095,98 337.5095,104 331.5095,104" fill="#e2ded9" stroke="#9c938a" stroke-width="0.75" />
  <text x="237.36650000000003" y="109.5" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">Block sparse attention pass (~200ms)</text>
</g>
<g class="note" data-position="over" data-actors="Target">
  <polygon points="325.8695,153 530.8475000000001,153 536.8475000000001,159 536.8475000000001,176 325.8695,176" fill="#ffffff" stroke="#9c938a" stroke-width="0.75" />
  <polygon points="530.8475000000001,153 536.8475000000001,159 530.8475000000001,159" fill="#e2ded9" stroke="#9c938a" stroke-width="0.75" />
  <text x="431.35850000000005" y="164.5" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">Compressed prefill (~500ms vs 6000ms)</text>
</g>
<g class="actor" data-id="User" data-label="User" data-type="participant">
