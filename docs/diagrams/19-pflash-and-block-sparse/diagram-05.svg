  <rect x="354.73300000000006" y="30" width="153.251" height="40" rx="4" ry="4" fill="#f1efec" stroke="#9c938a" stroke-width="1" />
  <text x="431.35850000000005" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="#2a2522" dy="4.55">Target Model (large)</text>
</g>
<g class="actor" data-id="Draft" data-label="Draft Model (small)" data-type="participant">
  <rect x="547.984" y="30" width="139.913" height="40" rx="4" ry="4" fill="#f1efec" stroke="#9c938a" stroke-width="1" />
  <text x="617.9405" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="#2a2522" dy="4.55">Draft Model (small)</text>
</g>
</svg>