  <rect x="40" y="40" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)"><tspan x="52" dy="-3.6000000000000014">Fine blocks (16-32 tokens)</tspan><tspan x="52" dy="15.600000000000001">Block size = 16 tokens</tspan></text>
</g>
