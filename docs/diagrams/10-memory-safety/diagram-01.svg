<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 491.567 365" width="491.567" height="365" style="--bg:#FFFFFF;--fg:#2A2522;background:#ffffff">
<style>
  /* Agave's own faces, the same stacks the chat UI and the wordmark use, so a
     diagram sits in the same product as the app. No webfont fetch. */
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Noto Sans', sans-serif; }
  .actor text, .subgraph text { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, 'Noto Sans Mono', monospace; }
  svg {
    /* Desert-night inks on a white canvas: --_text is the light-surface
       counterpart of the app's --text (docs/logo.svg), and the rest are
       hand-picked steps of it rather than mixes toward white, which would wash
       the warmth out. --_text-sec and --_line clear 4.5:1 and 3:1 on white;
       the pale steps carry no text. Overridable via --line, --accent, etc. */
    --_text:          #2a2522;
    --_text-sec:      var(--muted, #75716f);
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          var(--line, #94908c);
    --_arrow:         #504b47;
    --_node-fill:     var(--surface, #f1efec);
    --_node-stroke:   var(--border, #9c938a);
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="Code" x1="89.5825" y1="70" x2="89.5825" y2="335" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Stack" x1="240.5965" y1="70" x2="240.5965" y2="335" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Cleanup" x1="396.7975" y1="70" x2="396.7975" y2="335" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Code" data-to="Stack" data-label="defer file.close()" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="89.5825" y1="90" x2="240.5965" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="165.0895" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">defer file.close()</text>
</g>
<g class="message" data-from="Code" data-to="Stack" data-label="defer allocator.free(data)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="89.5825" y1="130" x2="240.5965" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="165.0895" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">defer allocator.free(data)</text>
</g>
<g class="message" data-from="Code" data-to="Code" data-label="return (normal or error)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="89.5825,185 119.5825,185 119.5825,205 89.5825,205" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="127.5825" y="195" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">return (normal or error)</text>
</g>
<g class="message" data-from="Stack" data-to="Cleanup" data-label="allocator.free(data)  [last declared, first run]" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="240.5965" y1="255" x2="396.7975" y2="255" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="318.697" y="245" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">allocator.free(data)  [last declared, first run]</text>
</g>
<g class="message" data-from="Stack" data-to="Cleanup" data-label="file.close()          [first declared, last run]" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="240.5965" y1="295" x2="396.7975" y2="295" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="318.697" y="285" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">file.close()          [first declared, last run]</text>
</g>
<g class="note" data-position="over" data-actors="Code">
  <polygon points="34.28649999999998,138 138.8785,138 144.8785,144 144.8785,161 34.28649999999998,161" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="138.8785,138 144.8785,144 138.8785,144" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="89.5825" y="149.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">... work happens ...</text>
</g>
<g class="actor" data-id="Code" data-label="Function Body" data-type="participant">
  <rect x="30" y="30" width="119.16499999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="89.5825" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Function Body</text>
</g>
<g class="actor" data-id="Stack" data-label="Defer Stack" data-type="participant">
  <rect x="189.165" y="30" width="102.863" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="240.5965" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Defer Stack</text>
</g>
<g class="actor" data-id="Cleanup" data-label="Cleanup Actions" data-type="participant">
  <rect x="332.028" y="30" width="129.539" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="396.7975" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Cleanup Actions</text>
</g>
</svg>