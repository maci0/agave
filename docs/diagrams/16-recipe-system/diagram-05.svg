</g>
<g class="message" data-from="Main" data-to="Rec" data-label="match(&quot;qwen35&quot;, &quot;Metal&quot;, &quot;Q4_K_M&quot;)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70.687" y1="170" x2="364.56399999999996" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="217.6255" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">match(&quot;qwen35&quot;, &quot;Metal&quot;, &quot;Q4_K_M&quot;)</text>
</g>
<g class="message" data-from="Rec" data-to="Main" data-label="Recipe { temp=0.6, top_p=0.9, max_tokens=1024 }" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="364.56399999999996" y1="210" x2="70.687" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="217.6255" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Recipe { temp=0.6, top_p=0.9, max_tokens=1024 }</text>
</g>
<g class="message" data-from="Main" data-to="CLI" data-label="parse flags, record which were set" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70.687" y1="250" x2="504.56399999999996" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="287.6255" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">parse flags, record which were set</text>
</g>
<g class="message" data-from="CLI" data-to="Main" data-label="temperature=0.3 (user set), top_p not set, max_tokens not set" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="504.56399999999996" y1="290" x2="70.687" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="287.6255" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">temperature=0.3 (user set), top_p not set, max_tokens not set</text>
</g>
<g class="message" data-from="Main" data-to="Rec" data-label="applyDefaults(user_values, overrides)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70.687" y1="330" x2="364.56399999999996" y2="330" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="217.6255" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">applyDefaults(user_values, overrides)</text>
</g>
<g class="message" data-from="Rec" data-to="Main" data-label="Applied { temp=0.3, top_p=0.9, max_tokens=1024 }" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="364.56399999999996" y1="385" x2="70.687" y2="385" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="217.6255" y="375" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Applied { temp=0.3, top_p=0.9, max_tokens=1024 }</text>
</g>
<g class="message" data-from="Main" data-to="Inf" data-label="run inference with final config" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70.687" y1="425" x2="653.355" y2="425" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="362.021" y="415" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">run inference with final config</text>
</g>
<g class="note" data-position="over" data-actors="Rec">
  <polygon points="183.34,338 539.7879999999999,338 545.7879999999999,344 545.7879999999999,361 183.34,361" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="539.7879999999999,338 545.7879999999999,344 539.7879999999999,344" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="364.56399999999996" y="349.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)"><tspan x="364.56399999999996" dy="-10.450000000000001">temperature → 0.3 (user)</tspan><tspan x="364.56399999999996" dy="14.3">top_p → 0.9 (recipe)</tspan><tspan x="364.56399999999996" dy="14.3">max_tokens → 1024 (recipe)</tspan></text>
</g>
<g class="actor" data-id="Main" data-label="main.zig" data-type="participant">
  <rect x="30" y="30" width="81.374" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="70.687" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">main.zig</text>
</g>
