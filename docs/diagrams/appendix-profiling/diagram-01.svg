<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1664.676 215.60000000000002" width="1664.676" height="215.60000000000002" style="--bg:#FFFFFF;--fg:#2A2522;background:#ffffff">
<style>
  /* Agave's own faces, the same stacks the chat UI and the wordmark use, so a
     diagram sits in the same product as the app. No webfont fetch. */
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Noto Sans', sans-serif; }
  .actor text, .subgraph text { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, 'Noto Sans Mono', monospace; }
  svg {
    /* Desert-night inks on a white canvas: --_text is the light-surface
       counterpart of the app's --text (docs/logo.svg), and the rest are
       hand-picked steps of it rather than mixes toward white, which would wash
       the warmth out. --_text-sec and --_line clear 4.5:1 and 3:1 on white;
       the pale steps carry no text. Overridable via --line, --accent, etc. */
    --_text:          #2a2522;
    --_text-sec:      var(--muted, #75716f);
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          var(--line, #94908c);
    --_arrow:         #504b47;
    --_node-fill:     var(--surface, #f1efec);
    --_node-stroke:   var(--border, #9c938a);
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Hot" data-label="Per-token loop">
  <rect x="642.724" y="146.6916666666667" width="0" height="0" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="642.724" y="146.6916666666667" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="654.724" y="160.6916666666667" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Per-token loop</text>
</g>
<polyline class="edge" data-from="CLI" data-to="Enable" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="149.381,100.24166666666667 197.381,100.24166666666667" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Enable" data-to="Forward" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="460.89,100.24166666666667 508.89,100.24166666666667" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Forward" data-to="OpWrap" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="642.724,106.39166666666668 678.724,106.39166666666668 678.724,142.55 690.724,142.55" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="OpWrap" data-to="Accumulate" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="882.356,142.55 930.356,142.55" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Accumulate" data-to="TokenEnd" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1101.981,142.55 1149.981,142.55" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="TokenEnd" data-to="Reset" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1263.067,142.55 1281.067,142.55 1281.067,66.9 1299.067,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="TokenEnd" data-to="Report" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1263.067,142.55 1281.067,142.55 1281.067,148.70000000000002 1299.067,148.70000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Reset" data-to="Forward" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1299.067,57.93333333333334 1263.067,57.93333333333334 1263.067,94.09166666666668 642.724,94.09166666666668" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="CLI" data-label="--profile flag" data-shape="rectangle">
  <rect x="40" y="81.79166666666669" width="109.381" height="36.900000000000006" rx="0" ry="0" fill="#e2e5e8" stroke="#5f7480" stroke-width="0.75" />
  <text x="94.6905" y="100.24166666666669" text-anchor="middle" font-size="13" font-weight="500" fill="#25333a" dy="4.55">--profile flag</text>
</g>
