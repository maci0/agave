  <text x="329.1355" y="100.24166666666667" text-anchor="middle" font-size="13" font-weight="500" fill="#25333a"><tspan x="329.1355" dy="-3.9000000000000012">PerfCounters.enabled = true</tspan><tspan x="329.1355" dy="16.900000000000002">MetalBackend.profile_counters = true</tspan></text>
</g>
