  <rect x="508.89" y="81.79166666666669" width="133.834" height="36.900000000000006" rx="0" ry="0" fill="#d0dac9" stroke="#7d9b6a" stroke-width="0.75" />
  <text x="575.807" y="100.24166666666669" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26" dy="4.55">Model forward()</text>
</g>
<g class="node" data-id="OpWrap" data-label="Per-op start()/end() wraps
(with GPU sync between)" data-shape="rectangle">
  <rect x="690.724" y="115.65" width="191.63199999999998" height="53.800000000000004" rx="0" ry="0" fill="#d0dac9" stroke="#7d9b6a" stroke-width="0.75" />
  <text x="786.5400000000001" y="142.55" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="786.5400000000001" dy="-3.9000000000000012">Per-op start()/end() wraps</tspan><tspan x="786.5400000000001" dy="16.900000000000002">(with GPU sync between)</tspan></text>
</g>
<g class="node" data-id="Accumulate" data-label="&quot;Accumulate times_us[" data-shape="rectangle">
  <rect x="930.356" y="124.10000000000002" width="171.62499999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1016.1685" y="142.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">&quot;Accumulate times_us[</text>
</g>
<g class="node" data-id="TokenEnd" data-label="End of token" data-shape="rectangle">
  <rect x="1149.981" y="124.10000000000002" width="113.086" height="36.900000000000006" rx="0" ry="0" fill="#f9f3ea" stroke="#c4823a" stroke-width="0.75" />
  <text x="1206.524" y="142.55" text-anchor="middle" font-size="13" font-weight="500" fill="#4a3116" dy="4.55">End of token</text>
</g>
<g class="node" data-id="Reset" data-label="resetCounters()
(dispatch/barrier/sync → 0, profile_counters = true)" data-shape="rectangle">
  <rect x="1299.067" y="40" width="337.60899999999987" height="53.800000000000004" rx="0" ry="0" fill="#e2e5e8" stroke="#5f7480" stroke-width="0.75" />
  <text x="1467.8715" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#25333a"><tspan x="1467.8715" dy="-3.9000000000000012">resetCounters()</tspan><tspan x="1467.8715" dy="16.900000000000002">(dispatch/barrier/sync → 0, profile_counters = true)</tspan></text>
</g>
<g class="node" data-id="Report" data-label="perf.report()
Print table + Metal counters" data-shape="rectangle">
  <rect x="1299.067" y="121.80000000000001" width="199.783" height="53.800000000000004" rx="0" ry="0" fill="#a9ba9e" stroke="#5f7f4c" stroke-width="0.75" />
  <text x="1398.9585" y="148.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#1e2b18"><tspan x="1398.9585" dy="-3.9000000000000012">perf.report()</tspan><tspan x="1398.9585" dy="16.900000000000002">Print table + Metal counters</tspan></text>
</g>
</svg>