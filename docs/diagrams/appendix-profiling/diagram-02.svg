<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 674.4939999999999 335" width="674.4939999999999" height="335" style="--bg:#ffffff;--fg:#2a2522;--line:#94908c;--accent:#c4823a;--muted:#75716f;--surface:#f1efec;--border:#9c938a;background:#ffffff">
<style>
  text { font-family: Inter, 'Adwaita Sans', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #2a2522;
    --_text-sec:      #75716f;
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          #94908c;
    --_arrow:         #504b47;
    --_node-fill:     #f1efec;
    --_node-stroke:   #9c938a;
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="#504b47" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="#504b47" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="CPU" x1="106.255" y1="70" x2="106.255" y2="305" stroke="#94908c" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="GPU" x1="293.2075" y1="70" x2="293.2075" y2="305" stroke="#94908c" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Perf" x1="460.894" y1="70" x2="460.894" y2="305" stroke="#94908c" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="CPU" data-to="Perf" data-label="t = perf.start() → nanoTimestamp()" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="106.255" y1="90" x2="460.894" y2="90" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="283.5745" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">t = perf.start() → nanoTimestamp()</text>
</g>
<g class="message" data-from="CPU" data-to="GPU" data-label="be.gemv(x, w, y, n, k)  [queued, not yet run]" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="106.255" y1="130" x2="293.2075" y2="130" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="199.73125" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">be.gemv(x, w, y, n, k)  [queued, not yet run]</text>
</g>
<g class="message" data-from="CPU" data-to="GPU" data-label="be.sync()  [block until GPU finishes]" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="106.255" y1="170" x2="293.2075" y2="170" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="199.73125" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">be.sync()  [block until GPU finishes]</text>
</g>
<g class="message" data-from="GPU" data-to="CPU" data-label="done" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="293.2075" y1="210" x2="106.255" y2="210" stroke="#94908c" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="199.73125" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">done</text>
</g>
<g class="message" data-from="CPU" data-to="Perf" data-label="perf.end(.gemv_qkv, t)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="106.255" y1="250" x2="460.894" y2="250" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="283.5745" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">perf.end(.gemv_qkv, t)</text>
</g>
<g class="note" data-position="over" data-actors="Perf">
  <polygon points="277.29400000000004,258 638.4939999999999,258 644.4939999999999,264 644.4939999999999,281 277.29400000000004,281" fill="#ffffff" stroke="#9c938a" stroke-width="0.75" />
  <polygon points="638.4939999999999,258 644.4939999999999,264 638.4939999999999,264" fill="#e2ded9" stroke="#9c938a" stroke-width="0.75" />
  <text x="460.894" y="269.5" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0"><tspan x="460.894" dy="-10.450000000000001">elapsed = now - t</tspan><tspan x="460.894" dy="14.3">times_us[gemv_qkv] += elapsed</tspan><tspan x="460.894" dy="14.3">counts[gemv_qkv] += 1</tspan></text>
</g>
