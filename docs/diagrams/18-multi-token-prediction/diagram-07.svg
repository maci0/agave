<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 633.1455 548" width="633.1455" height="548" style="--bg:#FFFFFF;--fg:#27272A;background:#ffffff">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #1a1a2e;
    --_text-sec:      var(--muted, color-mix(in srgb, #1a1a2e 60%, #ffffff));
    --_text-muted:    var(--muted, color-mix(in srgb, #1a1a2e 40%, #ffffff));
    --_text-faint:    color-mix(in srgb, #1a1a2e 25%, #ffffff);
    --_line:          var(--line, color-mix(in srgb, #1a1a2e 50%, #ffffff));
    --_arrow:         var(--accent, color-mix(in srgb, #1a1a2e 85%, #ffffff));
    --_node-fill:     var(--surface, color-mix(in srgb, #1a1a2e 3%, #ffffff));
    --_node-stroke:   var(--border, color-mix(in srgb, #1a1a2e 20%, #ffffff));
    --_group-fill:    #ffffff;
    --_group-hdr:     color-mix(in srgb, #1a1a2e 5%, #ffffff);
    --_inner-stroke:  color-mix(in srgb, #1a1a2e 12%, #ffffff);
    --_key-badge:     color-mix(in srgb, #1a1a2e 10%, #ffffff);
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="MTPArch" data-label="MTP (built-in heads)">
