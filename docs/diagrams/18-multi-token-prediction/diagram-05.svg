  <polygon points="290.24225,238 484.52825000000007,238 490.52825000000007,244 490.52825000000007,261 290.24225,261" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="484.52825000000007,238 490.52825000000007,244 484.52825000000007,244" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="390.38525000000004" y="249.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Draft pass — predict token t+2 cheaply</text>
</g>
<g class="note" data-position="over" data-actors="Main,KV">
  <polygon points="186.524,433 396.84800000000007,433 402.84800000000007,439 402.84800000000007,456 186.524,456" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
