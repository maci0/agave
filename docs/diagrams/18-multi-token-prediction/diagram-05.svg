<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 555.2860000000001 852" width="555.2860000000001" height="852" style="--bg:#FFFFFF;--fg:#27272A;background:#ffffff">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #1a1a2e;
    --_text-sec:      var(--muted, color-mix(in srgb, #1a1a2e 60%, #ffffff));
    --_text-muted:    var(--muted, color-mix(in srgb, #1a1a2e 40%, #ffffff));
    --_text-faint:    color-mix(in srgb, #1a1a2e 25%, #ffffff);
    --_line:          var(--line, color-mix(in srgb, #1a1a2e 50%, #ffffff));
    --_arrow:         var(--accent, color-mix(in srgb, #1a1a2e 85%, #ffffff));
    --_node-fill:     var(--surface, color-mix(in srgb, #1a1a2e 3%, #ffffff));
    --_node-stroke:   var(--border, color-mix(in srgb, #1a1a2e 20%, #ffffff));
    --_group-fill:    #ffffff;
    --_group-hdr:     color-mix(in srgb, #1a1a2e 5%, #ffffff);
    --_inner-stroke:  color-mix(in srgb, #1a1a2e 12%, #ffffff);
    --_key-badge:     color-mix(in srgb, #1a1a2e 10%, #ffffff);
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="alt" data-label="Draft accepted (70-85% of the time)">
  <rect x="30" y="578" width="495.28600000000006" height="194" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="30" y="578" width="211.02999999999997" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="36" y="587" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">alt [Draft accepted (70-85% of the time)]</text>
  <line x1="30" y1="684" x2="525.2860000000001" y2="684" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
  <text x="38" y="698" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">[Draft rejected]</text>
</g>
<line class="lifeline" data-actor="Main" x1="120.3305" y1="70" x2="120.3305" y2="822" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="MTP" x1="311.72900000000004" y1="70" x2="311.72900000000004" y2="822" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="KV" x1="469.04150000000004" y1="70" x2="469.04150000000004" y2="822" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Main" data-to="KV" data-label="Write K/V for token t" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="120.3305" y1="90" x2="469.04150000000004" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="294.68600000000004" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Write K/V for token t</text>
</g>
<g class="message" data-from="Main" data-to="Main" data-label="Save pre-norm hidden state" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="120.3305,130 150.3305,130 150.3305,150 120.3305,150" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="158.3305" y="140" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Save pre-norm hidden state</text>
</g>
<g class="message" data-from="Main" data-to="Main" data-label="Predict token t+1" data-line-style="dashed" data-arrow-head="filled" data-self="true">
