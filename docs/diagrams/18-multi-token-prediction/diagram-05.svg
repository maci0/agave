  <line x1="311.72900000000004" y1="285" x2="469.04150000000004" y2="285" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="390.38525000000004" y="275" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Write K/V for token t+1 (MTP cache)</text>
</g>
<g class="message" data-from="MTP" data-to="MTP" data-label="Fuse hidden(t) + embed(t+1)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="311.72900000000004,325 341.72900000000004,325 341.72900000000004,345 311.72900000000004,345" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="349.72900000000004" y="335" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Fuse hidden(t) + embed(t+1)</text>
</g>
<g class="message" data-from="MTP" data-to="MTP" data-label="Draft token t+2" data-line-style="dashed" data-arrow-head="filled" data-self="true">
  <polyline points="311.72900000000004,395 341.72900000000004,395 341.72900000000004,415 311.72900000000004,415" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="349.72900000000004" y="405" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Draft token t+2</text>
</g>
<g class="message" data-from="Main" data-to="KV" data-label="Write K/V for token t+1" data-line-style="solid" data-arrow-head="filled" data-self="false">
