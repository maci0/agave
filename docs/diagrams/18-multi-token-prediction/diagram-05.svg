</g>
<g class="message" data-from="Main" data-to="Main" data-label="Predict token t+2 (independently)" data-line-style="dashed" data-arrow-head="filled" data-self="true">
  <polyline points="120.3305,520 150.3305,520 150.3305,540 120.3305,540" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="158.3305" y="530" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Predict token t+2 (independently)</text>
</g>
<g class="message" data-from="Main" data-to="Main" data-label="Emit token t+1 AND token t+2 (free!)" data-line-style="dashed" data-arrow-head="filled" data-self="true">
  <polyline points="120.3305,618 150.3305,618 150.3305,638 120.3305,638" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="158.3305" y="628" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Emit token t+1 AND token t+2 (free!)</text>
</g>
<g class="message" data-from="Main" data-to="KV" data-label="Roll back MTP KV cache" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="120.3305" y1="712" x2="469.04150000000004" y2="712" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="294.68600000000004" y="702" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Roll back MTP KV cache</text>
</g>
<g class="message" data-from="Main" data-to="Main" data-label="Emit token t+1 only, use main model's t+2" data-line-style="dashed" data-arrow-head="filled" data-self="true">
  <polyline points="120.3305,752 150.3305,752 150.3305,772 120.3305,772" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="158.3305" y="762" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Emit token t+1 only, use main model&#39;s t+2</text>
</g>
