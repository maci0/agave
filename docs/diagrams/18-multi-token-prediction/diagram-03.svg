<g class="node" data-id="Diff" data-label="Key difference:
Standard can zero-gate (w→0 ⟹ output=0)
Offset cannot (w→0 ⟹ output=x_norm)
Provides a residual identity path
through the normalization step" data-shape="rectangle">
  <rect x="357.3585" y="473.4" width="276.10599999999994" height="104.50000000000001" rx="0" ry="0" fill="#f3e8ff" stroke="#9333ea" stroke-width="0.75" />
  <text x="495.41149999999993" y="525.65" text-anchor="middle" font-size="13" font-weight="500" fill="#581c87"><tspan x="495.41149999999993" dy="-29.250000000000004">Key difference:</tspan><tspan x="495.41149999999993" dy="16.900000000000002">Standard can zero-gate (w→0 ⟹ output=0)</tspan><tspan x="495.41149999999993" dy="16.900000000000002">Offset cannot (w→0 ⟹ output=x_norm)</tspan><tspan x="495.41149999999993" dy="16.900000000000002">Provides a residual identity path</tspan><tspan x="495.41149999999993" dy="16.900000000000002">through the normalization step</tspan></text>
</g>
