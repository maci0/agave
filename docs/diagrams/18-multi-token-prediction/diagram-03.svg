  <text x="634.5654999999999" y="301.825" text-anchor="middle" font-size="13" font-weight="500" fill="#1e3a5f"><tspan x="634.5654999999999" dy="-3.9000000000000012">w  (learned weight, stored in GGUF)</tspan><tspan x="634.5654999999999" dy="16.900000000000002">applied as (1 + w) at runtime</tspan></text>
</g>
