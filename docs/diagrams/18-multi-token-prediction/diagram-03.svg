  <rect x="254.51349999999996" y="185.8" width="199.042" height="36.900000000000006" rx="0" ry="0" fill="#dcfce7" stroke="#22c55e" stroke-width="0.75" />
  <text x="354.0345" y="204.25" text-anchor="middle" font-size="13" font-weight="500" fill="#14532d" dy="4.55">rms(x) = sqrt( mean(x²) + ε )</text>
</g>
