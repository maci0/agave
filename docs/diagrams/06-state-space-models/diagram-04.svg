<polyline class="edge" data-from="UpdateS" data-to="SMatrix" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="772.8405,448.81666666666666 784.8405,448.81666666666666 784.8405,451.6333333333333 820.8405,451.6333333333333" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="SMatrix" data-to="UpdateS" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="820.8405,428.06666666666666 784.8405,428.06666666666666 784.8405,430.8833333333333 772.8405,430.8833333333333" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
