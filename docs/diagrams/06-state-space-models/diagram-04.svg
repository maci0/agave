  <text x="532.7115" y="269.6" text-anchor="middle" font-size="13" font-weight="500" fill="#25333a"><tspan x="532.7115" dy="-3.9000000000000012">Token 32,000</tspan><tspan x="532.7115" dy="16.900000000000002">K, V stored</tspan></text>
</g>
