  <text x="395.22950000000003" y="120.93999999999997" text-anchor="middle" font-size="13" font-weight="500" fill="#25333a"><tspan x="395.22950000000003" dy="-3.9000000000000012">Query vector</tspan><tspan x="395.22950000000003" dy="16.900000000000002">(current token)</tspan></text>
