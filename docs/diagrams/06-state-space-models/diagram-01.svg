<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 797.7429999999999 875.64" width="797.7429999999999" height="875.64" style="--bg:#FFFFFF;--fg:#2A2522;background:#ffffff">
<style>
  /* Agave's own faces, the same stacks the chat UI and the wordmark use, so a
     diagram sits in the same product as the app. No webfont fetch. */
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Noto Sans', sans-serif; }
  .actor text, .subgraph text { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, 'Noto Sans Mono', monospace; }
  svg {
    /* Desert-night inks on a white canvas: --_text is the light-surface
       counterpart of the app's --text (docs/logo.svg), and the rest are
       hand-picked steps of it rather than mixes toward white, which would wash
       the warmth out. --_text-sec and --_line clear 4.5:1 and 3:1 on white;
       the pale steps carry no text. Overridable via --line, --accent, etc. */
    --_text:          #2a2522;
    --_text-sec:      var(--muted, #75716f);
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          var(--line, #94908c);
    --_arrow:         #504b47;
    --_node-fill:     var(--surface, #f1efec);
    --_node-stroke:   var(--border, #9c938a);
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Attention" data-label="Transformer Attention (O(n) per token)">
  <rect x="314.90600000000006" y="50.039999999999964" width="320.99899999999997" height="317.40000000000003" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="314.90600000000006" y="50.039999999999964" width="320.99899999999997" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="326.90600000000006" y="64.03999999999996" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Transformer Attention (O(n) per token)</text>
</g>
<g class="subgraph" data-id="SSM" data-label="SSM Recurrence (O(1) per token)">
  <rect x="426.37" y="416.43999999999994" width="331.373" height="419.20000000000005" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="426.37" y="416.43999999999994" width="331.373" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="438.37" y="430.43999999999994" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">SSM Recurrence (O(1) per token)</text>
</g>
<polyline class="edge" data-from="Past100K" data-to="KVCache" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="266.906,217.08999999999995 302.90600000000006,217.08999999999995 302.90600000000006,40.039999999999964 553.729,40.039999999999964 565.760625,50.039999999999964 565.760625,94.03999999999996" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
