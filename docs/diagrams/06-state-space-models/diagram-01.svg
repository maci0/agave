<polyline class="edge" data-from="State" data-to="Decay" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="658.8945,514.24 658.8945,526.24 586.8312916666667,526.24 586.8312916666667,562.24" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="NewTok" data-to="Decay" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="495.20799999999997,514.24 495.20799999999997,526.24 543.2079583333333,526.24 543.2079583333333,562.24" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
