<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 454.88 871.588" width="454.88" height="871.588" style="--bg:#ffffff;--fg:#2a2522;--line:#94908c;--accent:#c4823a;--muted:#75716f;--surface:#f1efec;--border:#9c938a;background:#ffffff">
<style>
  text { font-family: Inter, 'Adwaita Sans', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #2a2522;
    --_text-sec:      #75716f;
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          #94908c;
    --_arrow:         #504b47;
    --_node-fill:     #f1efec;
    --_node-stroke:   #9c938a;
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
