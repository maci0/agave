  <rect x="957.773" y="138.7" width="184.22199999999998" height="70.7" rx="0" ry="0" fill="#d0dac9" stroke="#7d9b6a" stroke-width="0.75" />
  <text x="1049.884" y="174.04999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="1049.884" dy="-12.350000000000001">Kept Blocks</tspan><tspan x="1049.884" dy="16.900000000000002">~5-15% of prompt</tspan><tspan x="1049.884" dy="16.900000000000002">(high-relevance context)</tspan></text>
</g>
