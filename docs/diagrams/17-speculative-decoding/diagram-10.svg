  <rect x="741.853" y="89.35" width="167.92" height="70.7" rx="0" ry="0" fill="#fef9c3" stroke="#eab308" stroke-width="0.75" />
  <text x="825.813" y="124.69999999999999" text-anchor="middle" font-size="13" font-weight="500" fill="#713f12"><tspan x="825.813" dy="-12.350000000000001">Adaptive Threshold</tspan><tspan x="825.813" dy="16.900000000000002">alpha x mean(scores)</tspan><tspan x="825.813" dy="16.900000000000002">(default alpha=0.85)</tspan></text>
</g>
<g class="node" data-id="Drop" data-label="Dropped Blocks
~85-95% of prompt
