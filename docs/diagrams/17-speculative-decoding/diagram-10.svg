  <text x="596.9254999999999" y="124.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="596.9254999999999" dy="-3.9000000000000012">&quot;Block Importance Scores</tspan><tspan x="596.9254999999999" dy="16.900000000000002">[0.1, 0.9, 0.2, 0.8, 0.3, 0.7, ...</tspan></text>
</g>
