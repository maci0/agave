  <rect x="1439.26" y="147.15" width="213.12099999999995" height="53.800000000000004" rx="0" ry="0" fill="#fef9c3" stroke="#eab308" stroke-width="0.75" />
  <text x="1545.8205" y="174.05" text-anchor="middle" font-size="13" font-weight="500" fill="#713f12"><tspan x="1545.8205" dy="-3.9000000000000012">KV Cache</tspan><tspan x="1545.8205" dy="16.900000000000002">(compressed representation)</tspan></text>
</g>
<g class="node" data-id="Decode" data-label="DDTree Speculative Decode
normal token generation loop" data-shape="rectangle">
  <rect x="1700.3809999999999" y="147.15" width="210.15699999999995" height="53.800000000000004" rx="0" ry="0" fill="#dcfce7" stroke="#22c55e" stroke-width="0.75" />
  <text x="1805.4595" y="174.05" text-anchor="middle" font-size="13" font-weight="500" fill="#14532d"><tspan x="1805.4595" dy="-3.9000000000000012">DDTree Speculative Decode</tspan><tspan x="1805.4595" dy="16.900000000000002">normal token generation loop</tspan></text>
</g>
<g class="node" data-id="Tokens" data-label="Output Tokens" data-shape="rectangle">
  <rect x="1958.5379999999998" y="155.60000000000002" width="127.16499999999999" height="36.900000000000006" rx="0" ry="0" fill="#bbf7d0" stroke="#16a34a" stroke-width="0.75" />
