  <rect x="204.791" y="89.35" width="247.20699999999997" height="70.7" rx="0" ry="0" fill="#dcfce7" stroke="#22c55e" stroke-width="0.75" />
  <text x="328.3945" y="124.69999999999999" text-anchor="middle" font-size="13" font-weight="500" fill="#14532d"><tspan x="328.3945" dy="-12.350000000000001">Scorer Model</tspan><tspan x="328.3945" dy="16.900000000000002">(draft model or dedicated tiny model)</tspan><tspan x="328.3945" dy="16.900000000000002">block-sparse O(n) pass</tspan></text>
</g>
<g class="node" data-id="Scores" data-label="&quot;Block Importance Scores
[0.1, 0.9, 0.2, 0.8, 0.3, 0.7, ..." data-shape="rectangle">
  <rect x="499.99799999999993" y="97.80000000000001" width="193.85500000000002" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="596.9254999999999" y="124.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="596.9254999999999" dy="-3.9000000000000012">&quot;Block Importance Scores</tspan><tspan x="596.9254999999999" dy="16.900000000000002">[0.1, 0.9, 0.2, 0.8, 0.3, 0.7, ...</tspan></text>
</g>
