<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2125.7029999999995 249.39999999999998" width="2125.7029999999995" height="249.39999999999998" style="--bg:#FFFFFF;--fg:#2A2522;background:#ffffff">
<style>
  /* Agave's own faces, the same stacks the chat UI and the wordmark use, so a
     diagram sits in the same product as the app. No webfont fetch. */
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Noto Sans', sans-serif; }
  .actor text, .subgraph text { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, 'Noto Sans Mono', monospace; }
  svg {
    /* Desert-night inks on a white canvas: --_text is the light-surface
       counterpart of the app's --text (docs/logo.svg), and the rest are
       hand-picked steps of it rather than mixes toward white, which would wash
       the warmth out. --_text-sec and --_line clear 4.5:1 and 3:1 on white;
       the pale steps carry no text. Overridable via --line, --accent, etc. */
    --_text:          #2a2522;
    --_text-sec:      var(--muted, #75716f);
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          var(--line, #94908c);
    --_arrow:         #504b47;
    --_node-fill:     var(--surface, #f1efec);
    --_node-stroke:   var(--border, #9c938a);
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Compression" data-label="PFlash Compression (8-20x)">
  <rect x="909.773" y="179.60000000000002" width="0" height="0" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="909.773" y="179.60000000000002" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="921.773" y="193.60000000000002" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">PFlash Compression (8-20x)</text>
</g>
<polyline class="edge" data-from="Prompt" data-to="Scorer" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="156.791,124.7 204.791,124.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Scorer" data-to="Scores" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="451.99799999999993,124.7 499.99799999999993,124.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Scores" data-to="Threshold" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="693.853,124.7 741.853,124.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Threshold" data-to="Drop" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="909.7729999999999,124.69999999999999 933.7729999999999,124.69999999999999 933.7729999999999,75.35 957.7729999999999,75.35" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Threshold" data-to="Keep" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="909.7729999999999,124.69999999999999 933.7729999999999,124.69999999999999 933.7729999999999,174.04999999999998 957.773,174.04999999999998" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Keep" data-to="Target" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1141.9950000000001,174.05 1189.9950000000001,174.05" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Target" data-to="KVCache" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1391.26,174.05 1439.26,174.05" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="KVCache" data-to="Decode" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1652.3809999999999,174.05 1700.3809999999999,174.05" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Decode" data-to="Tokens" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1910.5379999999998,174.05 1958.5379999999998,174.05" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Prompt" data-label="Long Prompt
128K tokens" data-shape="rectangle">
  <rect x="40" y="97.80000000000001" width="116.79099999999998" height="53.800000000000004" rx="0" ry="0" fill="#e2e5e8" stroke="#5f7480" stroke-width="0.75" />
  <text x="98.3955" y="124.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#25333a"><tspan x="98.3955" dy="-3.9000000000000012">Long Prompt</tspan><tspan x="98.3955" dy="16.900000000000002">128K tokens</tspan></text>
</g>
