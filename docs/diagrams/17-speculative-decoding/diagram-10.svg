  <text x="328.3945" y="124.69999999999999" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="328.3945" dy="-12.350000000000001">Scorer Model</tspan><tspan x="328.3945" dy="16.900000000000002">(draft model or dedicated tiny model)</tspan><tspan x="328.3945" dy="16.900000000000002">block-sparse O(n) pass</tspan></text>
</g>
