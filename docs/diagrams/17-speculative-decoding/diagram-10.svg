  <rect x="957.7729999999999" y="40" width="214.60299999999992" height="70.7" rx="0" ry="0" fill="#fee2e2" stroke="#ef4444" stroke-width="0.75" />
  <text x="1065.0745" y="75.35" text-anchor="middle" font-size="13" font-weight="500" fill="#7f1d1d"><tspan x="1065.0745" dy="-12.350000000000001">Dropped Blocks</tspan><tspan x="1065.0745" dy="16.900000000000002">~85-95% of prompt</tspan><tspan x="1065.0745" dy="16.900000000000002">(boilerplate, padding, off-topic)</tspan></text>
</g>
<g class="node" data-id="Keep" data-label="Kept Blocks
~5-15% of prompt
(high-relevance context)" data-shape="rectangle">
  <rect x="957.773" y="138.7" width="184.22199999999998" height="70.7" rx="0" ry="0" fill="#dcfce7" stroke="#22c55e" stroke-width="0.75" />
  <text x="1049.884" y="174.04999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="#14532d"><tspan x="1049.884" dy="-12.350000000000001">Kept Blocks</tspan><tspan x="1049.884" dy="16.900000000000002">~5-15% of prompt</tspan><tspan x="1049.884" dy="16.900000000000002">(high-relevance context)</tspan></text>
</g>
<g class="node" data-id="Target" data-label="Target Model
prefill compressed prompt
6-13K tokens instead of 128K" data-shape="rectangle">
  <rect x="1189.9950000000001" y="138.7" width="201.265" height="70.7" rx="0" ry="0" fill="#dcfce7" stroke="#22c55e" stroke-width="0.75" />
  <text x="1290.6275" y="174.04999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="#14532d"><tspan x="1290.6275" dy="-12.350000000000001">Target Model</tspan><tspan x="1290.6275" dy="16.900000000000002">prefill compressed prompt</tspan><tspan x="1290.6275" dy="16.900000000000002">6-13K tokens instead of 128K</tspan></text>
</g>
<g class="node" data-id="KVCache" data-label="KV Cache
