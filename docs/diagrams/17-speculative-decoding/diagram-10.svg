  <text x="1805.4595" y="174.05" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="1805.4595" dy="-3.9000000000000012">DDTree Speculative Decode</tspan><tspan x="1805.4595" dy="16.900000000000002">normal token generation loop</tspan></text>
