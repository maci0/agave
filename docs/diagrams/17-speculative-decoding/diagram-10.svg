  <text x="825.813" y="124.69999999999999" text-anchor="middle" font-size="13" font-weight="500" fill="#4a3116"><tspan x="825.813" dy="-12.350000000000001">Adaptive Threshold</tspan><tspan x="825.813" dy="16.900000000000002">alpha x mean(scores)</tspan><tspan x="825.813" dy="16.900000000000002">(default alpha=0.85)</tspan></text>
</g>
