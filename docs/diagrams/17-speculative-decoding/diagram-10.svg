<polyline class="edge" data-from="Threshold" data-to="Keep" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="909.7729999999999,124.69999999999999 933.7729999999999,124.69999999999999 933.7729999999999,174.04999999999998 957.773,174.04999999999998" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Keep" data-to="Target" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1141.9950000000001,174.05 1189.9950000000001,174.05" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Target" data-to="KVCache" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1391.26,174.05 1439.26,174.05" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="KVCache" data-to="Decode" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1652.3809999999999,174.05 1700.3809999999999,174.05" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Decode" data-to="Tokens" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1910.5379999999998,174.05 1958.5379999999998,174.05" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Prompt" data-label="Long Prompt
128K tokens" data-shape="rectangle">
  <rect x="40" y="97.80000000000001" width="116.79099999999998" height="53.800000000000004" rx="0" ry="0" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.75" />
  <text x="98.3955" y="124.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#1e3a5f"><tspan x="98.3955" dy="-3.9000000000000012">Long Prompt</tspan><tspan x="98.3955" dy="16.900000000000002">128K tokens</tspan></text>
</g>
<g class="node" data-id="Scorer" data-label="Scorer Model
