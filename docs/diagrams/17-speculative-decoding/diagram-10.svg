  <text x="1290.6275" y="174.04999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="1290.6275" dy="-12.350000000000001">Target Model</tspan><tspan x="1290.6275" dy="16.900000000000002">prefill compressed prompt</tspan><tspan x="1290.6275" dy="16.900000000000002">6-13K tokens instead of 128K</tspan></text>
