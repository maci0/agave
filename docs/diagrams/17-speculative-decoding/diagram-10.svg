  <text x="1065.0745" y="75.35" text-anchor="middle" font-size="13" font-weight="500" fill="#4a1c1c"><tspan x="1065.0745" dy="-12.350000000000001">Dropped Blocks</tspan><tspan x="1065.0745" dy="16.900000000000002">~85-95% of prompt</tspan><tspan x="1065.0745" dy="16.900000000000002">(boilerplate, padding, off-topic)</tspan></text>
</g>
<g class="node" data-id="Keep" data-label="Kept Blocks
