<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840.097 495" width="840.097" height="495" style="--bg:#FFFFFF;--fg:#27272A;background:#ffffff">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #1a1a2e;
    --_text-sec:      var(--muted, color-mix(in srgb, #1a1a2e 60%, #ffffff));
    --_text-muted:    var(--muted, color-mix(in srgb, #1a1a2e 40%, #ffffff));
    --_text-faint:    color-mix(in srgb, #1a1a2e 25%, #ffffff);
    --_line:          var(--line, color-mix(in srgb, #1a1a2e 50%, #ffffff));
    --_arrow:         var(--accent, color-mix(in srgb, #1a1a2e 85%, #ffffff));
    --_node-fill:     var(--surface, color-mix(in srgb, #1a1a2e 3%, #ffffff));
    --_node-stroke:   var(--border, color-mix(in srgb, #1a1a2e 20%, #ffffff));
    --_group-fill:    #ffffff;
    --_group-hdr:     color-mix(in srgb, #1a1a2e 5%, #ffffff);
    --_inner-stroke:  color-mix(in srgb, #1a1a2e 12%, #ffffff);
    --_key-badge:     color-mix(in srgb, #1a1a2e 10%, #ffffff);
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="alt" data-label="A = K (all accepted)">
  <rect x="66.37899999999996" y="303" width="493.8040000000001" height="100" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="66.37899999999996" y="303" width="135.79" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="72.37899999999996" y="312" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">alt [A = K (all accepted)]</text>
  <line x1="66.37899999999996" y1="315" x2="560.183" y2="315" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
  <text x="74.37899999999996" y="329" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">[A &lt; K (partial or zero acceptance)]</text>
</g>
<line class="lifeline" data-actor="DraftKV" x1="137.81399999999996" y1="70" x2="137.81399999999996" y2="465" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="TargetKV" x1="306.61199999999997" y1="70" x2="306.61199999999997" y2="465" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Verifier" x1="482.079" y1="70" x2="482.079" y2="465" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="DraftKV" data-to="DraftKV" data-label="forward passes x K
KV grows: P -&gt; P+K" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="137.81399999999996,90 167.81399999999996,90 167.81399999999996,110 137.81399999999996,110" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="175.81399999999996" y="100" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)"><tspan x="175.81399999999996" dy="-3.3000000000000007">forward passes x K</tspan><tspan x="175.81399999999996" dy="14.3">KV grows: P -&gt; P+K</tspan></text>
</g>
<g class="message" data-from="TargetKV" data-to="TargetKV" data-label="forwardTree() over draft tree
KV grows: P -&gt; P+K (tree nodes)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="306.61199999999997,160 336.61199999999997,160 336.61199999999997,180 306.61199999999997,180" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="344.61199999999997" y="170" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)"><tspan x="344.61199999999997" dy="-3.3000000000000007">forwardTree() over draft tree</tspan><tspan x="344.61199999999997" dy="14.3">KV grows: P -&gt; P+K (tree nodes)</tspan></text>
</g>
<g class="message" data-from="Verifier" data-to="Verifier" data-label="walk tree, find first mismatch
accepted = A tokens (0 &lt;= A &lt; K)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="482.079,230 512.079,230 512.079,250 482.079,250" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="520.079" y="240" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)"><tspan x="520.079" dy="-3.3000000000000007">walk tree, find first mismatch</tspan><tspan x="520.079" dy="14.3">accepted = A tokens (0 &lt;= A &lt; K)</tspan></text>
</g>
<g class="message" data-from="Verifier" data-to="TargetKV" data-label="setKvSeqLen(P + A + 1)
trim to accepted prefix + correction" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="482.079" y1="343" x2="306.61199999999997" y2="343" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="394.3455" y="333" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)"><tspan x="394.3455" dy="-3.3000000000000007">setKvSeqLen(P + A + 1)</tspan><tspan x="394.3455" dy="14.3">trim to accepted prefix + correction</tspan></text>
</g>
<g class="message" data-from="Verifier" data-to="DraftKV" data-label="setKvSeqLen(P + A + 1)
trim to same position" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="482.079" y1="383" x2="137.81399999999996" y2="383" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="309.9465" y="373" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)"><tspan x="309.9465" dy="-3.3000000000000007">setKvSeqLen(P + A + 1)</tspan><tspan x="309.9465" dy="14.3">trim to same position</tspan></text>
</g>
<g class="note" data-position="over" data-actors="DraftKV,TargetKV">
  <polygon points="118.80299999999997,268 319.62299999999993,268 325.62299999999993,274 325.62299999999993,291 118.80299999999997,291" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="319.62299999999993,268 325.62299999999993,274 319.62299999999993,274" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="222.21299999999997" y="279.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">both caches already at P+K, consistent</text>
</g>
<g class="note" data-position="over" data-actors="DraftKV,TargetKV">
  <polygon points="106.92299999999996,391 331.503,391 337.503,397 337.503,414 106.92299999999996,414" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="331.503,391 337.503,397 331.503,397" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="222.21299999999997" y="402.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Separate-model mode: two independent trims</text>
</g>
<g class="note" data-position="over" data-actors="DraftKV,TargetKV">
  <polygon points="30,418 408.42599999999993,418 414.42599999999993,424 414.42599999999993,441 30,441" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="408.42599999999993,418 414.42599999999993,424 408.42599999999993,424" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="222.21299999999997" y="429.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)"><tspan x="222.21299999999997" dy="-3.3000000000000007">Self-draft mode: single shared KV cache</tspan><tspan x="222.21299999999997" dy="14.3">one setKvSeqLen() call covers both</tspan></text>
</g>
<g class="actor" data-id="DraftKV" data-label="Draft KV Cache" data-type="participant">
  <rect x="76.37899999999996" y="30" width="122.86999999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="137.81399999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Draft KV Cache</text>
</g>
<g class="actor" data-id="TargetKV" data-label="Target KV Cache" data-type="participant">
  <rect x="239.24899999999997" y="30" width="134.726" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="306.61199999999997" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Target KV Cache</text>
</g>
<g class="actor" data-id="Verifier" data-label="Acceptance Walk" data-type="participant">
  <rect x="413.975" y="30" width="136.20800000000003" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="482.079" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Acceptance Walk</text>
</g>
</svg>