  <text x="296.9535" y="457.4890000000001" text-anchor="middle" font-size="13" font-weight="500" fill="#1e3a5f"><tspan x="296.9535" dy="-3.9000000000000012">For each draft token x_i</tspan><tspan x="296.9535" dy="16.900000000000002">proposed by draft model</tspan></text>
</g>
<g class="node" data-id="ReadProbs" data-label="Read probabilities
