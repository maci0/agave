p_target(x_i) from target logits" data-shape="rectangle">
  <rect x="190.39300000000006" y="520.389" width="213.12099999999995" height="70.7" rx="0" ry="0" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.75" />
