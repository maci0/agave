  <text x="784.5439166666666" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="#581c87"><tspan x="784.5439166666666" dy="-3.9000000000000012">Output is i.i.d. identical</tspan><tspan x="784.5439166666666" dy="16.900000000000002">to sampling from target alone</tspan></text>
