  <text x="296.9535" y="665.989" text-anchor="middle" font-size="13" font-weight="500" fill="#713f12"><tspan x="296.9535" dy="-3.9000000000000012">Compute acceptance ratio</tspan><tspan x="296.9535" dy="16.900000000000002">r = p_target(x_i) / p_draft(x_i)</tspan></text>
</g>
<g class="node" data-id="Sample" data-label="Sample u ~ Uniform(0, 1)" data-shape="rectangle">
  <rect x="210.02950000000004" y="740.889" width="173.84799999999998" height="36.900000000000006" rx="0" ry="0" fill="#fef9c3" stroke="#eab308" stroke-width="0.75" />
  <text x="296.9535" y="759.339" text-anchor="middle" font-size="13" font-weight="500" fill="#713f12" dy="4.55">Sample u ~ Uniform(0, 1)</text>
</g>
<g class="node" data-id="Accept" data-label="Accept x_i
