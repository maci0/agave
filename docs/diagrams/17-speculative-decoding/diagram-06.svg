</g>
<g class="node" data-id="More" data-label="more draft
tokens?" data-shape="diamond">
  <polygon points="416.95825,201.8 479.20275000000004,264.0445 416.95825,326.28900000000004 354.71375,264.0445" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="416.95825" y="264.0445" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="416.95825" dy="-3.9000000000000012">more draft</tspan><tspan x="416.95825" dy="16.900000000000002">tokens?</tspan></text>
</g>
<g class="node" data-id="G1" data-label="&quot;At every accepted position:
