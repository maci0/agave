  <text x="552.3149166666667" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="552.3149166666667" dy="-3.9000000000000012">&quot;At every accepted position:</tspan><tspan x="552.3149166666667" dy="16.900000000000002">E[output</tspan></text>
</g>
<g class="node" data-id="G2" data-label="Output is i.i.d. identical
to sampling from target alone" data-shape="rectangle">
