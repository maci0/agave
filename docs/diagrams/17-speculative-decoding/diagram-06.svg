<polyline class="edge" data-from="More" data-to="Start" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="yes" points="396.2100833333333,305.54083333333324 396.2100833333333,338.289 296.9535000000001,338.289 296.9535,430.5890000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
