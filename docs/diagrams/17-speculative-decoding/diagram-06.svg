  <rect x="218.64391666666668" y="83.10000000000001" width="187.927" height="70.7" rx="0" ry="0" fill="#bbf7d0" stroke="#16a34a" stroke-width="0.75" />
  <text x="312.60741666666667" y="118.45000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#14532d"><tspan x="312.60741666666667" dy="-12.350000000000001">Accept x_i</tspan><tspan x="312.60741666666667" dy="16.900000000000002">move to next position</tspan><tspan x="312.60741666666667" dy="16.900000000000002">no extra compute needed</tspan></text>
</g>
<g class="node" data-id="Residual" data-label="Compute residual distribution
