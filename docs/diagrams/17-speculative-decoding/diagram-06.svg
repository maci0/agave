  <text x="536.963" y="465.93900000000014" text-anchor="middle" font-size="13" font-weight="500" fill="#14532d"><tspan x="536.963" dy="-12.350000000000001">Sample bonus token</tspan><tspan x="536.963" dy="16.900000000000002">from p_target at position K+1</tspan><tspan x="536.963" dy="16.900000000000002">(always done after full acceptance)</tspan></text>
</g>
<g class="node" data-id="Decision" data-label="u &lt;= min(1, r)?" data-shape="diamond">
