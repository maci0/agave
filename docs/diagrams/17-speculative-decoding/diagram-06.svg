  <text x="202.97675000000004" y="1132.53" text-anchor="middle" font-size="13" font-weight="500" fill="#7f1d1d"><tspan x="202.97675000000004" dy="-12.350000000000001">Compute residual distribution</tspan><tspan x="202.97675000000004" dy="16.900000000000002">p_residual(x) = max(0, p_target(x) - p_draft(x))</tspan><tspan x="202.97675000000004" dy="16.900000000000002">normalized over full vocabulary</tspan></text>
</g>
<g class="node" data-id="Correct" data-label="Sample correction token x_i'
