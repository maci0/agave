  <text x="202.97675000000004" y="1369.93" text-anchor="middle" font-size="13" font-weight="500" fill="#7f1d1d"><tspan x="202.97675000000004" dy="-12.350000000000001">Stop -- discard all</tspan><tspan x="202.97675000000004" dy="16.900000000000002">remaining draft tokens</tspan><tspan x="202.97675000000004" dy="16.900000000000002">after position i</tspan></text>
