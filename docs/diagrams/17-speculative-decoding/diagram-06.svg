  <text x="202.97675000000004" y="1251.23" text-anchor="middle" font-size="13" font-weight="500" fill="#7f1d1d"><tspan x="202.97675000000004" dy="-12.350000000000001">Sample correction token x_i&#39;</tspan><tspan x="202.97675000000004" dy="16.900000000000002">from p_residual</tspan><tspan x="202.97675000000004" dy="16.900000000000002">replace x_i with x_i&#39;</tspan></text>
</g>
