  <rect x="1184.972" y="132.176" width="131.61100000000002" height="53.800000000000004" rx="0" ry="0" fill="#f9f3ea" stroke="#c4823a" stroke-width="0.75" />
  <text x="1250.7775" y="159.076" text-anchor="middle" font-size="13" font-weight="500" fill="#4a3116"><tspan x="1250.7775" dy="-3.9000000000000012">main spin-waits</tspan><tspan x="1250.7775" dy="16.900000000000002">while active != 0</tspan></text>
</g>
<g class="node" data-id="Done" data-label="parallelFor() returns" data-shape="rectangle">
  <rect x="1364.583" y="140.62599999999998" width="162.73300000000003" height="36.900000000000006" rx="0" ry="0" fill="#a9ba9e" stroke="#5f7f4c" stroke-width="0.75" />
  <text x="1445.9495000000002" y="159.07599999999996" text-anchor="middle" font-size="13" font-weight="500" fill="#1e2b18" dy="4.55">parallelFor() returns</text>
</g>
</svg>