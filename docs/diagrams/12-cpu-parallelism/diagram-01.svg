  <polygon points="341.506,40 419.68199999999996,118.17599999999999 341.506,196.35199999999998 263.33,118.17599999999999" fill="#f1efec" stroke="#9c938a" stroke-width="0.75" />
  <text x="341.506" y="118.17599999999999" text-anchor="middle" font-size="13" font-weight="500" fill="#2a2522"><tspan x="341.506" dy="-3.9000000000000012">total &lt;= grain</tspan><tspan x="341.506" dy="16.900000000000002">or no workers?</tspan></text>
</g>
<g class="node" data-id="Inline" data-label="run func() inline
