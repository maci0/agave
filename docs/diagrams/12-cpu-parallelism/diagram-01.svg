<line class="lifeline" data-actor="W1" x1="375.4095" y1="70" x2="375.4095" y2="763" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="W2" x1="515.4095" y1="70" x2="515.4095" y2="763" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="W1" data-to="K" data-label="futexWait(&amp;generation, 0)" data-line-style="solid" data-arrow-head="filled" data-self="false">
