  <rect x="540.182" y="132.176" width="159.028" height="53.800000000000004" rx="0" ry="0" fill="#f9f3ea" stroke="#c4823a" stroke-width="0.75" />
  <text x="619.696" y="159.076" text-anchor="middle" font-size="13" font-weight="500" fill="#4a3116"><tspan x="619.696" dy="-3.9000000000000012">post task descriptor</tspan><tspan x="619.696" dy="16.900000000000002">counter = 0</tspan></text>
</g>
<g class="node" data-id="Wake" data-label="generation++
