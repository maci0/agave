  <text x="553.4095" y="608" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">doWork()</text>
</g>
<g class="message" data-from="W1" data-to="M" data-label="active.fetchSub(1)" data-line-style="solid" data-arrow-head="filled" data-self="false">
