  <rect x="744.24" y="132.176" width="176.81199999999998" height="53.800000000000004" rx="0" ry="0" fill="#d0dac9" stroke="#7d9b6a" stroke-width="0.75" />
  <text x="832.646" y="159.076" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="832.646" dy="-3.9000000000000012">generation++</tspan><tspan x="832.646" dy="16.900000000000002">futexWake(all workers)</tspan></text>
</g>
<g class="node" data-id="Race" data-label="main + workers
race on task_counter
(fetchAdd per chunk)" data-shape="rectangle">
  <rect x="969.0519999999999" y="123.72599999999998" width="167.92000000000002" height="70.7" rx="0" ry="0" fill="#d0dac9" stroke="#7d9b6a" stroke-width="0.75" />
  <text x="1053.012" y="159.076" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="1053.012" dy="-12.350000000000001">main + workers</tspan><tspan x="1053.012" dy="16.900000000000002">race on task_counter</tspan><tspan x="1053.012" dy="16.900000000000002">(fetchAdd per chunk)</tspan></text>
</g>
<g class="node" data-id="Spin" data-label="main spin-waits
