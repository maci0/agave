<polyline class="edge" data-from="Wake" data-to="Race" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="921.0519999999999,159.07599999999996 969.0519999999999,159.07599999999996" fill="none" stroke="#94908c" stroke-width="1" marker-end="url(#arrowhead)" />
