  <rect x="540.182" y="50.37599999999998" width="144.20800000000003" height="53.800000000000004" rx="0" ry="0" fill="#e8c3c3" stroke="#c05c5c" stroke-width="0.75" />
  <text x="612.2860000000001" y="77.27599999999998" text-anchor="middle" font-size="13" font-weight="500" fill="#4a1c1c"><tspan x="612.2860000000001" dy="-3.9000000000000012">run func() inline</tspan><tspan x="612.2860000000001" dy="16.900000000000002">on caller&#39;s thread</tspan></text>
</g>
<g class="node" data-id="Post" data-label="post task descriptor
