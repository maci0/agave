<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574.2669999999998 597" width="574.2669999999998" height="597" style="--bg:#FFFFFF;--fg:#27272A;background:#ffffff">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #1a1a2e;
    --_text-sec:      var(--muted, color-mix(in srgb, #1a1a2e 60%, #ffffff));
    --_text-muted:    var(--muted, color-mix(in srgb, #1a1a2e 40%, #ffffff));
    --_text-faint:    color-mix(in srgb, #1a1a2e 25%, #ffffff);
    --_line:          var(--line, color-mix(in srgb, #1a1a2e 50%, #ffffff));
    --_arrow:         var(--accent, color-mix(in srgb, #1a1a2e 85%, #ffffff));
    --_node-fill:     var(--surface, color-mix(in srgb, #1a1a2e 3%, #ffffff));
    --_node-stroke:   var(--border, color-mix(in srgb, #1a1a2e 20%, #ffffff));
    --_group-fill:    #ffffff;
    --_group-hdr:     color-mix(in srgb, #1a1a2e 5%, #ffffff);
    --_inner-stroke:  color-mix(in srgb, #1a1a2e 12%, #ffffff);
    --_key-badge:     color-mix(in srgb, #1a1a2e 10%, #ffffff);
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="M" x1="164.29799999999994" y1="70" x2="164.29799999999994" y2="567" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="W" x1="321.98099999999994" y1="70" x2="321.98099999999994" y2="567" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="M" data-to="M" data-label="task_total = 1024 (plain write)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="164.29799999999994,90 194.29799999999994,90 194.29799999999994,110 164.29799999999994,110" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="202.29799999999994" y="100" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">task_total = 1024 (plain write)</text>
</g>
<g class="message" data-from="M" data-to="M" data-label="task_grain = 4 (plain write)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="164.29799999999994,160 194.29799999999994,160 194.29799999999994,180 164.29799999999994,180" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="202.29799999999994" y="170" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">task_grain = 4 (plain write)</text>
</g>
<g class="message" data-from="M" data-to="M" data-label="generation.fetchAdd(1, .release)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="164.29799999999994,230 194.29799999999994,230 194.29799999999994,250 164.29799999999994,250" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="202.29799999999994" y="240" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">generation.fetchAdd(1, .release)</text>
</g>
<g class="message" data-from="W" data-to="W" data-label="local_gen = generation.load(.acquire)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="321.98099999999994,342 351.98099999999994,342 351.98099999999994,362 321.98099999999994,362" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="359.98099999999994" y="352" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">local_gen = generation.load(.acquire)</text>
</g>
<g class="message" data-from="W" data-to="W" data-label="read task_total → sees 1024 ✓" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="321.98099999999994,427 351.98099999999994,427 351.98099999999994,447 321.98099999999994,447" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="359.98099999999994" y="437" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">read task_total → sees 1024 ✓</text>
</g>
<g class="message" data-from="W" data-to="W" data-label="read task_grain → sees 4 ✓" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="321.98099999999994,497 351.98099999999994,497 351.98099999999994,517 321.98099999999994,517" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="359.98099999999994" y="507" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">read task_grain → sees 4 ✓</text>
</g>
<g class="note" data-position="over" data-actors="M">
  <polygon points="30,268 292.5959999999999,268 298.5959999999999,274 298.5959999999999,291 30,291" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="292.5959999999999,268 298.5959999999999,274 292.5959999999999,274" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="164.29799999999994" y="279.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)"><tspan x="164.29799999999994" dy="-3.3000000000000007">.release: all prior writes</tspan><tspan x="164.29799999999994" dy="14.3">are visible before this store</tspan></text>
</g>
<g class="note" data-position="over" data-actors="M,W">
  <polygon points="163.19249999999994,295 317.08649999999994,295 323.08649999999994,301 323.08649999999994,318 163.19249999999994,318" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="317.08649999999994,295 323.08649999999994,301 317.08649999999994,301" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="243.13949999999994" y="306.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">futexWake / futexWait handoff</text>
</g>
<g class="note" data-position="over" data-actors="W">
  <polygon points="136.00500000000002,380 501.9569999999999,380 507.9569999999999,386 507.9569999999999,403 136.00500000000002,403" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="501.9569999999999,380 507.9569999999999,386 501.9569999999999,386" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="321.98099999999994" y="391.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)"><tspan x="321.98099999999994" dy="-10.450000000000001">.acquire: all writes that</tspan><tspan x="321.98099999999994" dy="14.3">happened before the .release</tspan><tspan x="321.98099999999994" dy="14.3">are now visible here</tspan></text>
</g>
<g class="actor" data-id="M" data-label="Main Thread" data-type="participant">
  <rect x="109.53199999999995" y="30" width="109.532" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="164.29799999999994" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Main Thread</text>
</g>
<g class="actor" data-id="W" data-label="Worker Thread" data-type="participant">
  <rect x="259.06399999999996" y="30" width="125.834" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="321.98099999999994" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Worker Thread</text>
</g>
</svg>