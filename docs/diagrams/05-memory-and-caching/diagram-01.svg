<polyline class="edge" data-from="T2" data-to="C2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="635.7750000000003,66.9 683.7750000000003,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
