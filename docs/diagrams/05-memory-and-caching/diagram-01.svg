  <text x="1192.8675000000003" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1192.8675000000003" dy="-3.9000000000000012">&quot;Cache</tspan><tspan x="1192.8675000000003" dy="16.900000000000002">[K₁, V₁</tspan></text>
