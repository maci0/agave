  <rect x="354.4670000000003" y="50.90000000000001" width="99.02800000000002" height="30.3" rx="2" ry="2" fill="#ffffff" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="403.98100000000034" y="66.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">attend to 1 position</text>
</g>
