  <text x="482.9445" y="728.4" text-anchor="middle" font-size="13" font-weight="500" fill="#1e2b18"><tspan x="482.9445" dy="-3.9000000000000012">FFN layer</tspan><tspan x="482.9445" dy="16.900000000000002">(GPU — continues normally)</tspan></text>
</g>
</svg>