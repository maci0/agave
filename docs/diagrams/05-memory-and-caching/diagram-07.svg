  <rect x="388.981" y="379.2" width="187.927" height="53.800000000000004" rx="0" ry="0" fill="#f9f3ea" stroke="#c4823a" stroke-width="0.75" />
  <text x="482.9445" y="406.09999999999997" text-anchor="middle" font-size="13" font-weight="500" fill="#4a3116"><tspan x="482.9445" dy="-3.9000000000000012">m = max(mᵍ, mᶜ)</tspan><tspan x="482.9445" dy="16.900000000000002">(global max for rescaling)</tspan></text>
</g>
<g class="node" data-id="Rescale" data-label="Rescale each partial:
Oᵍ ← Oᵍ × exp(mᵍ - m)
Oᶜ ← Oᶜ × exp(mᶜ - m)" data-shape="rectangle">
