  <text x="482.94449999999995" y="626.6" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="482.94449999999995" dy="-3.9000000000000012">O = (Oᵍ·lᵍ + Oᶜ·lᶜ) / (lᵍ + lᶜ)</tspan><tspan x="482.94449999999995" dy="16.900000000000002">(weighted sum normalized by combined denominators)</tspan></text>
</g>
<g class="node" data-id="FFN" data-label="FFN layer
