</g>
<g class="node" data-id="MaxMerge" data-label="m = max(mᵍ, mᶜ)
(global max for rescaling)" data-shape="rectangle">
  <rect x="388.981" y="379.2" width="187.927" height="53.800000000000004" rx="0" ry="0" fill="#fef9c3" stroke="#eab308" stroke-width="0.75" />
  <text x="482.9445" y="406.09999999999997" text-anchor="middle" font-size="13" font-weight="500" fill="#713f12"><tspan x="482.9445" dy="-3.9000000000000012">m = max(mᵍ, mᶜ)</tspan><tspan x="482.9445" dy="16.900000000000002">(global max for rescaling)</tspan></text>
</g>
<g class="node" data-id="Rescale" data-label="Rescale each partial:
Oᵍ ← Oᵍ × exp(mᵍ - m)
Oᶜ ← Oᶜ × exp(mᶜ - m)" data-shape="rectangle">
  <rect x="400.4665" y="481" width="164.95600000000002" height="70.7" rx="0" ry="0" fill="#fef9c3" stroke="#eab308" stroke-width="0.75" />
  <text x="482.9445" y="516.35" text-anchor="middle" font-size="13" font-weight="500" fill="#713f12"><tspan x="482.9445" dy="-12.350000000000001">Rescale each partial:</tspan><tspan x="482.9445" dy="16.900000000000002">Oᵍ ← Oᵍ × exp(mᵍ - m)</tspan><tspan x="482.9445" dy="16.900000000000002">Oᶜ ← Oᶜ × exp(mᶜ - m)</tspan></text>
</g>
<g class="node" data-id="Combine" data-label="O = (Oᵍ·lᵍ + Oᶜ·lᶜ) / (lᵍ + lᶜ)
