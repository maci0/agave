online softmax" data-shape="rectangle">
  <rect x="522.8795" y="141.8" width="124.20099999999998" height="70.7" rx="0" ry="0" fill="#dcfce7" stroke="#22c55e" stroke-width="0.75" />
  <text x="584.98" y="177.15" text-anchor="middle" font-size="13" font-weight="500" fill="#14532d"><tspan x="584.98" dy="-12.350000000000001">CPU SDPA</tspan><tspan x="584.98" dy="16.900000000000002">thread pool</tspan><tspan x="584.98" dy="16.900000000000002">online softmax</tspan></text>
