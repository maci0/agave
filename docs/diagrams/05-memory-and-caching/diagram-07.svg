  <text x="584.98" y="177.15" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="584.98" dy="-12.350000000000001">CPU SDPA</tspan><tspan x="584.98" dy="16.900000000000002">thread pool</tspan><tspan x="584.98" dy="16.900000000000002">online softmax</tspan></text>
