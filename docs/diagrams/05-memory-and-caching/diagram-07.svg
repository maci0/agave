<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703.7529999999999 795.3" width="703.7529999999999" height="795.3" style="--bg:#ffffff;--fg:#2a2522;--line:#94908c;--accent:#c4823a;--muted:#75716f;--surface:#f1efec;--border:#9c938a;background:#ffffff">
<style>
  text { font-family: Inter, 'Adwaita Sans', system-ui, sans-serif; }
