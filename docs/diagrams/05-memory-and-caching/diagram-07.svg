  <text x="482.9445" y="516.35" text-anchor="middle" font-size="13" font-weight="500" fill="#4a3116"><tspan x="482.9445" dy="-12.350000000000001">Rescale each partial:</tspan><tspan x="482.9445" dy="16.900000000000002">Oᵍ ← Oᵍ × exp(mᵍ - m)</tspan><tspan x="482.9445" dy="16.900000000000002">Oᶜ ← Oᶜ × exp(mᶜ - m)</tspan></text>
</g>
<g class="node" data-id="Combine" data-label="O = (Oᵍ·lᵍ + Oᶜ·lᶜ) / (lᵍ + lᶜ)
