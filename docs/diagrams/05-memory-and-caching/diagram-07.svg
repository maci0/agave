  <text x="380.909" y="177.15" text-anchor="middle" font-size="13" font-weight="500" fill="#14532d"><tspan x="380.909" dy="-12.350000000000001">GPU SDPA kernel</tspan><tspan x="380.909" dy="16.900000000000002">FlashAttention-2</tspan><tspan x="380.909" dy="16.900000000000002">causal masking</tspan></text>
</g>
