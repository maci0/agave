  <text x="380.909" y="295.85" text-anchor="middle" font-size="13" font-weight="500" fill="#4a3116"><tspan x="380.909" dy="-12.350000000000001">Partial output Oᵍ</tspan><tspan x="380.909" dy="16.900000000000002">local max mᵍ</tspan><tspan x="380.909" dy="16.900000000000002">local sum lᵍ</tspan></text>
</g>
