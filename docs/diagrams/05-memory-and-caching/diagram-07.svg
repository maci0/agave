  <text x="204.4745" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#25333a"><tspan x="204.4745" dy="-3.9000000000000012">Q/K/V projections</tspan><tspan x="204.4745" dy="16.900000000000002">(GPU — full speed)</tspan></text>
</g>
