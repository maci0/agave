<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 717.091 795.3" width="717.091" height="795.3" style="--bg:#FFFFFF;--fg:#2A2522;background:#ffffff">
<style>
  /* Agave's own faces, the same stacks the chat UI and the wordmark use, so a
     diagram sits in the same product as the app. No webfont fetch. */
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Noto Sans', sans-serif; }
  .actor text, .subgraph text { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, 'Noto Sans Mono', monospace; }
  svg {
    /* Desert-night inks on a white canvas: --_text is the light-surface
       counterpart of the app's --text (docs/logo.svg), and the rest are
       hand-picked steps of it rather than mixes toward white, which would wash
       the warmth out. --_text-sec and --_line clear 4.5:1 and 3:1 on white;
       the pale steps carry no text. Overridable via --line, --accent, etc. */
    --_text:          #2a2522;
    --_text-sec:      var(--muted, #75716f);
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          var(--line, #94908c);
    --_arrow:         #504b47;
    --_node-fill:     var(--surface, #f1efec);
    --_node-stroke:   var(--border, #9c938a);
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Split" data-label="Concurrent split-attention — GPU and CPU overlap">
  <rect x="60" y="40" width="52" height="80" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="60" y="40" width="52" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="72" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Concurrent split-attention — GPU and CPU overlap</text>
<g class="subgraph" data-id="GPU" data-label="GPU SDPA (VRAM)">
  <rect x="76" y="84" width="0" height="0" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="76" y="84" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="88" y="98" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">GPU SDPA (VRAM)</text>
</g>
<g class="subgraph" data-id="CPU" data-label="CPU SDPA (RAM)">
  <rect x="76" y="104" width="0" height="0" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="76" y="104" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="88" y="118" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">CPU SDPA (RAM)</text>
</g>
</g>
<g class="subgraph" data-id="Merge" data-label="Online softmax merge (exact — no approximation)">
  <rect x="40" y="40" width="0" height="0" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Online softmax merge (exact — no approximation)</text>
</g>


<polyline class="edge" data-from="GBlocks" data-to="GSDPA" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="380.909,93.80000000000001 380.909,141.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="GSDPA" data-to="GOut" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="380.909,212.5 380.909,260.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="CBlocks" data-to="CSDPA" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="584.98,93.80000000000001 584.98,141.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="CSDPA" data-to="COut" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="584.98,212.5 584.98,260.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="GOut" data-to="MaxMerge" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="380.909,331.2 380.909,355.2 482.9445,355.2 482.9445,379.2" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="COut" data-to="MaxMerge" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="584.98,331.2 584.98,355.2 482.9445,355.2 482.9445,379.2" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="MaxMerge" data-to="Rescale" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="482.9445,433 482.9445,481" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Rescale" data-to="Combine" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="482.9445,551.7 482.94449999999995,599.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Combine" data-to="FFN" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="482.94449999999995,653.5 482.9445,701.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Proj" data-to="GPU" data-label="dispatch query">
  <rect x="-44.16800000000001" y="-15.15" width="88.33600000000003" height="30.3" rx="2" ry="2" fill="#ffffff" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="0" y="0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">dispatch query</text>
</g>
<g class="edge-label" data-from="Proj" data-to="CPU" data-label="dispatch query">
  <rect x="-44.16800000000001" y="-15.15" width="88.33600000000003" height="30.3" rx="2" ry="2" fill="#ffffff" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="0" y="0" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">dispatch query</text>
</g>
