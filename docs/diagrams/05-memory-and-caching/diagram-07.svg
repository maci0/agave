  <text x="380.909" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#25333a"><tspan x="380.909" dy="-3.9000000000000012">Recent KV blocks</tspan><tspan x="380.909" dy="16.900000000000002">(hot — VRAM resident)</tspan></text>
</g>
<g class="node" data-id="GSDPA" data-label="GPU SDPA kernel
FlashAttention-2
causal masking" data-shape="rectangle">
