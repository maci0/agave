  <rect x="383.79400000000004" y="701.5" width="198.30099999999996" height="53.800000000000004" rx="0" ry="0" fill="#bbf7d0" stroke="#16a34a" stroke-width="0.75" />
  <text x="482.9445" y="728.4" text-anchor="middle" font-size="13" font-weight="500" fill="#14532d"><tspan x="482.9445" dy="-3.9000000000000012">FFN layer</tspan><tspan x="482.9445" dy="16.900000000000002">(GPU — continues normally)</tspan></text>
