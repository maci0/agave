  <rect x="40" y="121.80000000000001" width="156.064" height="53.800000000000004" rx="0" ry="0" fill="#d2bcb6" stroke="#a97f75" stroke-width="0.75" />
  <text x="118.032" y="148.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#3d2520"><tspan x="118.032" dy="-3.9000000000000012">T=0.3 → peaky</tspan><tspan x="118.032" dy="16.900000000000002">top token dominates</tspan></text>
</g>
<g class="node" data-id="T_mid" data-label="T=1.0 → balanced
raw model probs" data-shape="rectangle">
  <rect x="40" y="203.60000000000002" width="138.28000000000003" height="53.800000000000004" rx="0" ry="0" fill="#d2bcb6" stroke="#a97f75" stroke-width="0.75" />
  <text x="109.14000000000001" y="230.50000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="#3d2520"><tspan x="109.14000000000001" dy="-3.9000000000000012">T=1.0 → balanced</tspan><tspan x="109.14000000000001" dy="16.900000000000002">raw model probs</tspan></text>
</g>
<g class="node" data-id="T_high" data-label="T=1.5 → flat
many tokens compete" data-shape="rectangle">
  <rect x="40" y="285.40000000000003" width="166.438" height="53.800000000000004" rx="0" ry="0" fill="#d2bcb6" stroke="#a97f75" stroke-width="0.75" />
  <text x="123.219" y="312.3" text-anchor="middle" font-size="13" font-weight="500" fill="#3d2520"><tspan x="123.219" dy="-3.9000000000000012">T=1.5 → flat</tspan><tspan x="123.219" dy="16.900000000000002">many tokens compete</tspan></text>
