  <text x="290.23300000000006" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="290.23300000000006" dy="-3.9000000000000012">Divide by Temperature</tspan><tspan x="290.23300000000006" dy="16.900000000000002">logit / T</tspan></text>
</g>
<g class="node" data-id="Adjusted" data-label="Adjusted Logits" data-shape="rectangle">
