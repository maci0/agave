  <text x="657.9765000000001" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="657.9765000000001" dy="-3.9000000000000012">Softmax</tspan><tspan x="657.9765000000001" dy="16.900000000000002">e^x / Σe^x</tspan></text>
</g>
<g class="node" data-id="Probs" data-label="&quot;Probabilities
[0.72, 0.19, 0.09, ..." data-shape="rectangle">
  <rect x="756.9620000000001" y="40" width="141.24400000000003" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="827.5840000000001" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="827.5840000000001" dy="-3.9000000000000012">&quot;Probabilities</tspan><tspan x="827.5840000000001" dy="16.900000000000002">[0.72, 0.19, 0.09, ...</tspan></text>
</g>
