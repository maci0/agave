  <text x="498.743" y="148.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#25333a"><tspan x="498.743" dy="-3.9000000000000012">Runtime</tspan><tspan x="498.743" dy="16.900000000000002">(user runs program)</tspan></text>
</g>
<g class="node" data-id="Result" data-label="Instant result
(no computation)" data-shape="rectangle">
  <rect x="816.983" y="80.9" width="136.05700000000002" height="53.800000000000004" rx="0" ry="0" fill="#a9ba9e" stroke="#5f7f4c" stroke-width="0.75" />
  <text x="885.0115" y="107.80000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="#1e2b18"><tspan x="885.0115" dy="-3.9000000000000012">Instant result</tspan><tspan x="885.0115" dy="16.900000000000002">(no computation)</tspan></text>
</g>
</svg>