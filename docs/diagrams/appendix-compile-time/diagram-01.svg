<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 993.04 215.60000000000002" width="993.04" height="215.60000000000002" style="--bg:#FFFFFF;--fg:#2A2522;background:#ffffff">
<style>
  /* Agave's own faces, the same stacks the chat UI and the wordmark use, so a
     diagram sits in the same product as the app. No webfont fetch. */
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Noto Sans', sans-serif; }
  .actor text, .subgraph text { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, 'Noto Sans Mono', monospace; }
  svg {
    /* Desert-night inks on a white canvas: --_text is the light-surface
       counterpart of the app's --text (docs/logo.svg), and the rest are
       hand-picked steps of it rather than mixes toward white, which would wash
       the warmth out. --_text-sec and --_line clear 4.5:1 and 3:1 on white;
       the pale steps carry no text. Overridable via --line, --accent, etc. */
    --_text:          #2a2522;
    --_text-sec:      var(--muted, #75716f);
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          var(--line, #94908c);
    --_arrow:         #504b47;
    --_node-fill:     var(--surface, #f1efec);
    --_node-stroke:   var(--border, #9c938a);
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="CompilePhase" data-label="Compile Phase (your machine, once)">
  <rect x="361.596" y="121.80000000000001" width="0" height="0" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="361.596" y="121.80000000000001" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="373.596" y="135.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Compile Phase (your machine, once)</text>
</g>
<g class="subgraph" data-id="RunPhase" data-label="Run Phase (user's machine, many times)">
  <rect x="361.596" y="149.8" width="0" height="0" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="361.596" y="149.8" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="373.596" y="163.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Run Phase (user&#39;s machine, many times)</text>
</g>
<polyline class="edge" data-from="Source" data-to="Compiler" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="213.107,66.9 261.10699999999997,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Compiler" data-to="Value" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="379.38,66.9 418.488,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Value" data-to="Binary" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="561.2139999999999,66.9 598.552,66.9 598.552,107.80000000000001 618.106,107.80000000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Runtime" data-to="Binary" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="578.998,148.70000000000002 598.552,148.70000000000002 598.552,107.80000000000001 618.106,107.80000000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Binary" data-to="Result" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="768.983,107.80000000000001 816.983,107.80000000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Source" data-label="Source Code
(comptime expression)" data-shape="rectangle">
  <rect x="40" y="40" width="173.107" height="53.800000000000004" rx="0" ry="0" fill="#e2e5e8" stroke="#5f7480" stroke-width="0.75" />
  <text x="126.5535" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#25333a"><tspan x="126.5535" dy="-3.9000000000000012">Source Code</tspan><tspan x="126.5535" dy="16.900000000000002">(comptime expression)</tspan></text>
</g>
