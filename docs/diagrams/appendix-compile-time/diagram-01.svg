  <rect x="261.10699999999997" y="40" width="118.273" height="53.800000000000004" rx="0" ry="0" fill="#d0dac9" stroke="#7d9b6a" stroke-width="0.75" />
  <text x="320.2435" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="320.2435" dy="-3.9000000000000012">Zig Compiler</tspan><tspan x="320.2435" dy="16.900000000000002">(compile time)</tspan></text>
</g>
