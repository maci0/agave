  <rect x="618.106" y="80.9" width="150.877" height="53.800000000000004" rx="0" ry="0" fill="#a9ba9e" stroke="#5f7f4c" stroke-width="0.75" />
  <text x="693.5445" y="107.80000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="#1e2b18"><tspan x="693.5445" dy="-3.9000000000000012">Executable Binary</tspan><tspan x="693.5445" dy="16.900000000000002">(.rodata section)</tspan></text>
</g>
