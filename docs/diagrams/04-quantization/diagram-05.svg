  <rect x="136.043" y="327.65" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="148.043" y="341.65" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Companion tensors</text>
</g>
