<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455.158 735" width="455.158" height="735" style="--bg:#ffffff;--fg:#2a2522;--line:#94908c;--accent:#c4823a;--muted:#75716f;--surface:#f1efec;--border:#9c938a;background:#ffffff">
<style>
  text { font-family: Inter, 'Adwaita Sans', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #2a2522;
    --_text-sec:      #75716f;
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          #94908c;
    --_arrow:         #504b47;
    --_node-fill:     #f1efec;
    --_node-stroke:   #9c938a;
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="#504b47" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="#504b47" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="CPU" x1="70" y1="70" x2="70" y2="705" stroke="#94908c" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="GPU" x1="210" y1="70" x2="210" y2="705" stroke="#94908c" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="CPU" data-to="GPU" data-label="dispatch Q projection" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="90" x2="210" y2="90" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="140" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">dispatch Q projection</text>
</g>
<g class="message" data-from="GPU" data-to="GPU" data-label="load x from VRAM, compute Q" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="210,130 240,130 240,150 210,150" fill="none" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="248" y="140" font-size="11" text-anchor="start" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">load x from VRAM, compute Q</text>
</g>
<g class="message" data-from="GPU" data-to="CPU" data-label="barrier (Q done)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="200" x2="70" y2="200" stroke="#94908c" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">barrier (Q done)</text>
</g>
<g class="message" data-from="CPU" data-to="GPU" data-label="dispatch K projection" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="240" x2="210" y2="240" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="140" y="230" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">dispatch K projection</text>
</g>
<g class="message" data-from="GPU" data-to="GPU" data-label="load x from VRAM again, compute K" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="210,280 240,280 240,300 210,300" fill="none" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="248" y="290" font-size="11" text-anchor="start" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">load x from VRAM again, compute K</text>
</g>
<g class="message" data-from="GPU" data-to="CPU" data-label="barrier (K done)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="350" x2="70" y2="350" stroke="#94908c" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="340" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">barrier (K done)</text>
</g>
<g class="message" data-from="CPU" data-to="GPU" data-label="dispatch V projection" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="390" x2="210" y2="390" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="140" y="380" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">dispatch V projection</text>
</g>
<g class="message" data-from="GPU" data-to="GPU" data-label="load x from VRAM again, compute V" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="210,430 240,430 240,450 210,450" fill="none" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="248" y="440" font-size="11" text-anchor="start" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">load x from VRAM again, compute V</text>
</g>
<g class="message" data-from="GPU" data-to="CPU" data-label="barrier (V done)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="500" x2="70" y2="500" stroke="#94908c" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="490" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">barrier (V done)</text>
</g>
<g class="message" data-from="CPU" data-to="GPU" data-label="dispatch Q + K + V together" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="555" x2="210" y2="555" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="140" y="545" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">dispatch Q + K + V together</text>
</g>
<g class="message" data-from="GPU" data-to="GPU" data-label="load x once, compute Q then K then V" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="210,595 240,595 240,615 210,615" fill="none" stroke="#94908c" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="248" y="605" font-size="11" text-anchor="start" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">load x once, compute Q then K then V</text>
</g>
<g class="message" data-from="GPU" data-to="CPU" data-label="barrier (all done)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="210" y1="665" x2="70" y2="665" stroke="#94908c" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="140" y="655" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">barrier (all done)</text>
</g>
<g class="note" data-position="over" data-actors="CPU,GPU">
  <polygon points="34.51100000000001,508 239.48899999999998,508 245.48899999999998,514 245.48899999999998,531 34.51100000000001,531" fill="#ffffff" stroke="#9c938a" stroke-width="0.75" />
  <polygon points="239.48899999999998,508 245.48899999999998,514 239.48899999999998,514" fill="#e2ded9" stroke="#9c938a" stroke-width="0.75" />
  <text x="140" y="519.5" font-size="11" text-anchor="middle" font-weight="400" fill="#a8a4a0" dy="3.8499999999999996">Batched (gemvMulti), 1 dispatch, 1 barrier</text>
</g>
<g class="actor" data-id="CPU" data-label="CPU" data-type="participant">
  <rect x="30" y="30" width="80" height="40" rx="4" ry="4" fill="#f1efec" stroke="#9c938a" stroke-width="1" />
  <text x="70" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="#2a2522" dy="4.55">CPU</text>
</g>
<g class="actor" data-id="GPU" data-label="GPU" data-type="participant">
  <rect x="170" y="30" width="80" height="40" rx="4" ry="4" fill="#f1efec" stroke="#9c938a" stroke-width="1" />
  <text x="210" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="#2a2522" dy="4.55">GPU</text>
</g>
</svg>