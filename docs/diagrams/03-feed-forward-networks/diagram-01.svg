<polyline class="edge" data-from="Input" data-to="Up" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="175.31599999999997,107.80000000000001 199.31599999999997,107.80000000000001 199.31599999999997,148.70000000000002 398.1105,148.70000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Gate" data-to="Act" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="346.77599999999995,66.9 398.1105,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
