  <text x="966.8105" y="107.80000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="#1e2b18"><tspan x="966.8105" dy="-3.9000000000000012">FFN Output</tspan><tspan x="966.8105" dy="16.900000000000002">(2304 floats)</tspan></text>
