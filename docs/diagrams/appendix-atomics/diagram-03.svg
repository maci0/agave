<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680.9975000000001 410" width="680.9975000000001" height="410" style="--bg:#FFFFFF;--fg:#27272A;background:#ffffff">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #1a1a2e;
    --_text-sec:      var(--muted, color-mix(in srgb, #1a1a2e 60%, #ffffff));
    --_text-muted:    var(--muted, color-mix(in srgb, #1a1a2e 40%, #ffffff));
    --_text-faint:    color-mix(in srgb, #1a1a2e 25%, #ffffff);
    --_line:          var(--line, color-mix(in srgb, #1a1a2e 50%, #ffffff));
    --_arrow:         var(--accent, color-mix(in srgb, #1a1a2e 85%, #ffffff));
    --_node-fill:     var(--surface, color-mix(in srgb, #1a1a2e 3%, #ffffff));
    --_node-stroke:   var(--border, color-mix(in srgb, #1a1a2e 20%, #ffffff));
    --_group-fill:    #ffffff;
    --_group-hdr:     color-mix(in srgb, #1a1a2e 5%, #ffffff);
    --_inner-stroke:  color-mix(in srgb, #1a1a2e 12%, #ffffff);
    --_key-badge:     color-mix(in srgb, #1a1a2e 10%, #ffffff);
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="P" x1="96.2515" y1="70" x2="96.2515" y2="380" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="F" x1="285.7975" y1="70" x2="285.7975" y2="380" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="C" x1="476.82550000000003" y1="70" x2="476.82550000000003" y2="380" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="P" data-to="P" data-label="data[0..99] = compute(...)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="96.2515,90 126.2515,90 126.2515,110 96.2515,110" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="134.2515" y="100" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">data[0..99] = compute(...)</text>
</g>
<g class="message" data-from="P" data-to="F" data-label="store(true, .release)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="96.2515" y1="160" x2="285.7975" y2="160" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="191.0245" y="150" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">store(true, .release)</text>
</g>
<g class="message" data-from="C" data-to="F" data-label="load(.acquire) → false, spin..." data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="476.82550000000003" y1="215" x2="285.7975" y2="215" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="381.3115" y="205" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">load(.acquire) → false, spin...</text>
</g>
<g class="message" data-from="C" data-to="F" data-label="load(.acquire) → true" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="476.82550000000003" y1="255" x2="285.7975" y2="255" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="381.3115" y="245" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">load(.acquire) → true</text>
</g>
<g class="message" data-from="C" data-to="C" data-label="process(data[0..99])  ✓ safe" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="476.82550000000003,310 506.82550000000003,310 506.82550000000003,330 476.82550000000003,330" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="514.8255" y="320" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">process(data[0..99])  ✓ safe</text>
</g>
<g class="note" data-position="over" data-actors="P,F">
  <polygon points="37.71850000000006,168 338.3304999999999,168 344.3304999999999,174 344.3304999999999,191 37.71850000000006,191" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="338.3304999999999,168 344.3304999999999,174 338.3304999999999,174" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="191.0245" y="179.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)"><tspan x="191.0245" dy="-3.3000000000000007">Release fence: data writes</tspan><tspan x="191.0245" dy="14.3">guaranteed visible before flag flip</tspan></text>
</g>
<g class="note" data-position="over" data-actors="F,C">
  <polygon points="233.94550000000007,263 522.6775,263 528.6775,269 528.6775,286 233.94550000000007,286" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="522.6775,263 528.6775,269 522.6775,269" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="381.3115" y="274.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)"><tspan x="381.3115" dy="-3.3000000000000007">Acquire fence: consumer now</tspan><tspan x="381.3115" dy="14.3">sees all pre-release writes</tspan></text>
</g>
<g class="actor" data-id="P" data-label="Producer thread" data-type="participant">
  <rect x="30" y="30" width="132.503" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="96.2515" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Producer thread</text>
</g>
<g class="actor" data-id="F" data-label="ready flag (atomic bool)" data-type="participant">
  <rect x="202.50300000000004" y="30" width="166.58899999999997" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="285.7975" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">ready flag (atomic bool)</text>
</g>
<g class="actor" data-id="C" data-label="Consumer thread" data-type="participant">
  <rect x="409.09200000000004" y="30" width="135.467" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="476.82550000000003" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Consumer thread</text>
</g>
</svg>