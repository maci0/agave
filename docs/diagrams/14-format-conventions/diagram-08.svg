<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 682.724 333.4" width="682.724" height="333.4" style="--bg:#FFFFFF;--fg:#27272A;background:#ffffff">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #1a1a2e;
    --_text-sec:      var(--muted, color-mix(in srgb, #1a1a2e 60%, #ffffff));
    --_text-muted:    var(--muted, color-mix(in srgb, #1a1a2e 40%, #ffffff));
    --_text-faint:    color-mix(in srgb, #1a1a2e 25%, #ffffff);
    --_line:          var(--line, color-mix(in srgb, #1a1a2e 50%, #ffffff));
    --_arrow:         var(--accent, color-mix(in srgb, #1a1a2e 85%, #ffffff));
    --_node-fill:     var(--surface, color-mix(in srgb, #1a1a2e 3%, #ffffff));
    --_node-stroke:   var(--border, color-mix(in srgb, #1a1a2e 20%, #ffffff));
    --_group-fill:    #ffffff;
    --_group-hdr:     color-mix(in srgb, #1a1a2e 5%, #ffffff);
    --_inner-stroke:  color-mix(in srgb, #1a1a2e 12%, #ffffff);
    --_key-badge:     color-mix(in srgb, #1a1a2e 10%, #ffffff);
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="OnDisk" data-label="On-disk representation">
  <rect x="40" y="237.39999999999998" width="0" height="0" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="237.39999999999998" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="251.39999999999998" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">On-disk representation</text>
</g>
<g class="subgraph" data-id="Parse" data-label="Parsing step">
  <rect x="40" y="265.4" width="0" height="0" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="265.4" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="279.4" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Parsing step</text>
</g>
<g class="subgraph" data-id="Normalized" data-label="Normalized TensorInfo (both formats)">
  <rect x="40" y="293.4" width="0" height="0" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="293.4" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="307.4" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Normalized TensorInfo (both formats)</text>
</g>
<polyline class="edge" data-from="GGDisk" data-to="GGParse" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="289.43000000000006,75.35 337.43000000000006,75.35" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="GGParse" data-to="Result" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="511.278,75.35 535.278,75.35 535.278,124.7 559.278,124.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="STDisk" data-to="STParse" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="247.19300000000004,174.04999999999998 295.19300000000004,174.04999999999998" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="STParse" data-to="Result" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="511.278,174.04999999999998 535.278,174.04999999999998 535.278,124.7 559.278,124.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="GGDisk" data-label="&quot;GGUF binary
dims stored reversed
[cols, rows" data-shape="rectangle">
  <rect x="121.51000000000008" y="40" width="167.92" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="205.47000000000008" y="75.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="205.47000000000008" dy="-12.350000000000001">&quot;GGUF binary</tspan><tspan x="205.47000000000008" dy="16.900000000000002">dims stored reversed</tspan><tspan x="205.47000000000008" dy="16.900000000000002">[cols, rows</tspan></text>
</g>
<g class="node" data-id="STDisk" data-label="&quot;SafeTensors JSON header
dims in PyTorch order
[rows, cols" data-shape="rectangle">
  <rect x="40.00000000000006" y="138.7" width="207.19299999999998" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="143.59650000000005" y="174.04999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="143.59650000000005" dy="-12.350000000000001">&quot;SafeTensors JSON header</tspan><tspan x="143.59650000000005" dy="16.900000000000002">dims in PyTorch order</tspan><tspan x="143.59650000000005" dy="16.900000000000002">[rows, cols</tspan></text>
</g>
<g class="node" data-id="GGParse" data-label="&quot;gguf.zig readTensor()
reverses dims array:
dims[d" data-shape="rectangle">
  <rect x="337.43000000000006" y="40" width="173.84799999999998" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="424.35400000000004" y="75.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="424.35400000000004" dy="-12.350000000000001">&quot;gguf.zig readTensor()</tspan><tspan x="424.35400000000004" dy="16.900000000000002">reverses dims array:</tspan><tspan x="424.35400000000004" dy="16.900000000000002">dims[d</tspan></text>
</g>
<g class="node" data-id="STParse" data-label="safetensors.zig readTensor()
no reversal needed
dims taken as-is" data-shape="rectangle">
  <rect x="295.19300000000004" y="138.7" width="216.08499999999998" height="70.7" rx="0" ry="0" fill="#dcfce7" stroke="#22c55e" stroke-width="0.75" />
  <text x="403.2355" y="174.04999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="#14532d"><tspan x="403.2355" dy="-12.350000000000001">safetensors.zig readTensor()</tspan><tspan x="403.2355" dy="16.900000000000002">no reversal needed</tspan><tspan x="403.2355" dy="16.900000000000002">dims taken as-is</tspan></text>
</g>
<g class="node" data-id="Result" data-label="&quot;dims[0" data-shape="rectangle">
  <rect x="559.278" y="106.25" width="83.446" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="601.001" y="124.7" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">&quot;dims[0</text>
</g>
</svg>