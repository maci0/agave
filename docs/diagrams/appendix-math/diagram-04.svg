<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420.869 693.9" width="420.869" height="693.9" style="--bg:#FFFFFF;--fg:#2A2522;background:#ffffff">
<style>
  /* Agave's own faces, the same stacks the chat UI and the wordmark use, so a
     diagram sits in the same product as the app. No webfont fetch. */
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Noto Sans', sans-serif; }
  .actor text, .subgraph text { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, 'Noto Sans Mono', monospace; }
  svg {
    /* Desert-night inks on a white canvas: --_text is the light-surface
       counterpart of the app's --text (docs/logo.svg), and the rest are
       hand-picked steps of it rather than mixes toward white, which would wash
       the warmth out. --_text-sec and --_line clear 4.5:1 and 3:1 on white;
       the pale steps carry no text. Overridable via --line, --accent, etc. */
    --_text:          #2a2522;
    --_text-sec:      var(--muted, #75716f);
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          var(--line, #94908c);
    --_arrow:         #504b47;
    --_node-fill:     var(--surface, #f1efec);
    --_node-stroke:   var(--border, #9c938a);
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Input" data-to="Naive" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="213.21325000000002,93.80000000000001 213.21325000000002,117.80000000000001 122.47800000000001,117.80000000000001 122.47800000000001,141.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Naive" data-to="Overflow" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="122.47800000000001,178.70000000000002 122.47800000000001,226.70000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Input" data-to="FindMax" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="213.21325000000002,93.80000000000001 213.21325000000002,117.80000000000001 303.9485,117.80000000000001 303.9485,141.80000000000004" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="FindMax" data-to="Shift" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="303.9485,178.70000000000005 303.9485,226.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Shift" data-to="ExpSafe" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="303.9485,280.50000000000006 303.9485000000001,328.50000000000006" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="ExpSafe" data-to="Sum" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="303.9485000000001,382.30000000000007 303.9485,430.30000000000007" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Sum" data-to="Divide" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="303.9485,467.20000000000005 303.9485,515.2" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Divide" data-to="Probs" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="303.9485,552.1 303.9485,600.1" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Input" data-label="&quot;Raw scores x
e.g. [1000, 1001, 999" data-shape="rectangle">
  <rect x="139.62725" y="40" width="147.17200000000003" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="213.21325000000002" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="213.21325000000002" dy="-3.9000000000000012">&quot;Raw scores x</tspan><tspan x="213.21325000000002" dy="16.900000000000002">e.g. [1000, 1001, 999</tspan></text>
</g>
