  <rect x="40" y="141.8" width="164.95600000000002" height="36.900000000000006" rx="0" ry="0" fill="#d0dac9" stroke="#7d9b6a" stroke-width="0.75" />
  <text x="122.47800000000001" y="160.25" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26" dy="4.55">Naive: exp(x) directly</text>
</g>
<g class="node" data-id="Overflow" data-label="exp(1000) = Inf
overflow — unusable" data-shape="rectangle">
  <rect x="42.964" y="226.70000000000002" width="159.02800000000002" height="53.800000000000004" rx="0" ry="0" fill="#e8c3c3" stroke="#c05c5c" stroke-width="0.75" />
  <text x="122.47800000000001" y="253.60000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#4a1c1c"><tspan x="122.47800000000001" dy="-3.9000000000000012">exp(1000) = Inf</tspan><tspan x="122.47800000000001" dy="16.900000000000002">overflow — unusable</tspan></text>
</g>
<g class="node" data-id="FindMax" data-label="Find max(x) = 1001" data-shape="rectangle">
  <rect x="232.95600000000002" y="141.80000000000004" width="141.985" height="36.900000000000006" rx="0" ry="0" fill="#d0dac9" stroke="#7d9b6a" stroke-width="0.75" />
  <text x="303.9485" y="160.25000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26" dy="4.55">Find max(x) = 1001</text>
</g>
<g class="node" data-id="Shift" data-label="&quot;Subtract max
x_shifted = [-1, 0, -2" data-shape="rectangle">
  <rect x="230.733" y="226.70000000000005" width="146.431" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="303.9485" y="253.60000000000005" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="303.9485" dy="-3.9000000000000012">&quot;Subtract max</tspan><tspan x="303.9485" dy="16.900000000000002">x_shifted = [-1, 0, -2</tspan></text>
</g>
<g class="node" data-id="ExpSafe" data-label="&quot;exp(x_shifted)
= [0.368, 1.0, 0.135" data-shape="rectangle">
  <rect x="234.06750000000005" y="328.50000000000006" width="139.762" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="303.9485000000001" y="355.40000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="303.9485000000001" dy="-3.9000000000000012">&quot;exp(x_shifted)</tspan><tspan x="303.9485000000001" dy="16.900000000000002">= [0.368, 1.0, 0.135</tspan></text>
</g>
<g class="node" data-id="Sum" data-label="sum = 1.503" data-shape="rectangle">
  <rect x="251.11050000000003" y="430.30000000000007" width="105.676" height="36.900000000000006" rx="0" ry="0" fill="#f9f3ea" stroke="#c4823a" stroke-width="0.75" />
  <text x="303.9485" y="448.75000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="#4a3116" dy="4.55">sum = 1.503</text>
</g>
<g class="node" data-id="Divide" data-label="Divide each by sum" data-shape="rectangle">
  <rect x="227.02800000000002" y="515.2" width="153.841" height="36.900000000000006" rx="0" ry="0" fill="#d0dac9" stroke="#7d9b6a" stroke-width="0.75" />
  <text x="303.9485" y="533.6500000000001" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26" dy="4.55">Divide each by sum</text>
</g>
<g class="node" data-id="Probs" data-label="&quot;Probabilities
[0.245, 0.665, 0.090" data-shape="rectangle">
  <rect x="227.02800000000002" y="600.1" width="153.841" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="303.9485" y="627" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="303.9485" dy="-3.9000000000000012">&quot;Probabilities</tspan><tspan x="303.9485" dy="16.900000000000002">[0.245, 0.665, 0.090</tspan></text>
</g>
</svg>