</g>
<polyline class="edge" data-from="Messages" data-to="Template" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="233.11399999999995,66.9 281.1139999999999,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
