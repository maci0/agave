<polyline class="edge" data-from="Visible" data-to="Merge" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="974.9810000000001,66.9 1022.9810000000001,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
