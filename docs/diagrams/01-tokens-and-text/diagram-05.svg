  <text x="883.0135" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="883.0135" dy="-3.9000000000000012">Transformer Layers</tspan><tspan x="883.0135" dy="16.900000000000002">attention + FFN × N</tspan></text>
</g>
<g class="node" data-id="Hidden" data-label="&quot;Final Hidden State
[4096 float32s" data-shape="rectangle">
  <rect x="1013.121" y="40" width="150.877" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1088.5595" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1088.5595" dy="-3.9000000000000012">&quot;Final Hidden State</tspan><tspan x="1088.5595" dy="16.900000000000002">[4096 float32s</tspan></text>
</g>
<g class="node" data-id="Proj" data-label="&quot;Output Projection
[vocab_size × n_embd" data-shape="rectangle">
  <rect x="1211.9979999999998" y="40" width="173.107" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1298.5514999999998" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1298.5514999999998" dy="-3.9000000000000012">&quot;Output Projection</tspan><tspan x="1298.5514999999998" dy="16.900000000000002">[vocab_size × n_embd</tspan></text>
</g>
<g class="node" data-id="Logits" data-label="&quot;Logits
[vocab_size scores" data-shape="rectangle">
  <rect x="1433.1049999999998" y="40" width="160.51" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1513.3599999999997" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1513.3599999999997" dy="-3.9000000000000012">&quot;Logits</tspan><tspan x="1513.3599999999997" dy="16.900000000000002">[vocab_size scores</tspan></text>
</g>
<g class="node" data-id="NextTok" data-label="Next Token ID" data-shape="rectangle">
  <rect x="1734.9049999999997" y="48.45" width="123.46" height="36.900000000000006" rx="0" ry="0" fill="#a9ba9e" stroke="#5f7f4c" stroke-width="0.75" />
  <text x="1796.6349999999998" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#1e2b18" dy="4.55">Next Token ID</text>
</g>
</svg>