  <text x="375.4665" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="375.4665" dy="-3.9000000000000012">&quot;Embedding Table</tspan><tspan x="375.4665" dy="16.900000000000002">[vocab_size × n_embd</tspan></text>
</g>
<g class="node" data-id="Vec" data-label="&quot;Float Vector
[4096 float32s" data-shape="rectangle">
  <rect x="629.446" y="40" width="123.46" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="691.176" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="691.176" dy="-3.9000000000000012">&quot;Float Vector</tspan><tspan x="691.176" dy="16.900000000000002">[4096 float32s</tspan></text>
</g>
<g class="node" data-id="Layers" data-label="Transformer Layers
attention + FFN × N" data-shape="rectangle">
