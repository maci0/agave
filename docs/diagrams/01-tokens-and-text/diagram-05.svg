<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1898.3649999999998 133.8" width="1898.3649999999998" height="133.8" style="--bg:#FFFFFF;--fg:#2A2522;background:#ffffff">
<style>
  /* Agave's own faces, the same stacks the chat UI and the wordmark use, so a
     diagram sits in the same product as the app. No webfont fetch. */
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Noto Sans', sans-serif; }
  .actor text, .subgraph text { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, 'Noto Sans Mono', monospace; }
  svg {
    /* Desert-night inks on a white canvas: --_text is the light-surface
       counterpart of the app's --text (docs/logo.svg), and the rest are
       hand-picked steps of it rather than mixes toward white, which would wash
       the warmth out. --_text-sec and --_line clear 4.5:1 and 3:1 on white;
       the pale steps carry no text. Overridable via --line, --accent, etc. */
    --_text:          #2a2522;
    --_text-sec:      var(--muted, #75716f);
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          var(--line, #94908c);
    --_arrow:         #504b47;
    --_node-fill:     var(--surface, #f1efec);
    --_node-stroke:   var(--border, #9c938a);
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="TID" data-to="Lookup" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="row index" points="137.525,66.9 288.913,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Lookup" data-to="Vec" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="read one row" points="462.02,66.9 629.446,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Vec" data-to="Layers" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="752.9060000000001,66.9 800.9060000000001,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Layers" data-to="Hidden" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="965.121,66.9 1013.121,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Hidden" data-to="Proj" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1163.9979999999998,66.9 1211.9979999999998,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Proj" data-to="Logits" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1385.1049999999998,66.9 1433.1049999999998,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Logits" data-to="NextTok" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="argmax" points="1593.6149999999998,66.9 1734.9049999999997,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="TID" data-to="Lookup" data-label="row index">
  <rect x="181.525" y="50.90000000000001" width="63.388" height="30.3" rx="2" ry="2" fill="#ffffff" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="213.219" y="66.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">row index</text>
</g>
<g class="edge-label" data-from="Lookup" data-to="Vec" data-label="read one row">
  <rect x="506.02" y="50.90000000000001" width="79.42599999999999" height="30.3" rx="2" ry="2" fill="#ffffff" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="545.733" y="66.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">read one row</text>
</g>
<g class="edge-label" data-from="Logits" data-to="NextTok" data-label="argmax">
  <rect x="1637.6149999999998" y="50.90000000000001" width="53.29" height="30.3" rx="2" ry="2" fill="#ffffff" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="1664.2599999999998" y="66.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">argmax</text>
</g>
<g class="node" data-id="TID" data-label="Token ID
e.g. 15496" data-shape="rectangle">
  <rect x="40" y="40" width="97.525" height="53.800000000000004" rx="0" ry="0" fill="#e2e5e8" stroke="#5f7480" stroke-width="0.75" />
  <text x="88.7625" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#25333a"><tspan x="88.7625" dy="-3.9000000000000012">Token ID</tspan><tspan x="88.7625" dy="16.900000000000002">e.g. 15496</tspan></text>
</g>
<g class="node" data-id="Lookup" data-label="&quot;Embedding Table
