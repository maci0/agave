<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1454.232 408.3" width="1454.232" height="408.3" style="--bg:#FFFFFF;--fg:#2A2522;background:#ffffff">
<style>
  /* Agave's own faces, the same stacks the chat UI and the wordmark use, so a
     diagram sits in the same product as the app. No webfont fetch. */
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Noto Sans', sans-serif; }
  .actor text, .subgraph text { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, 'Noto Sans Mono', monospace; }
  svg {
    /* Desert-night inks on a white canvas: --_text is the light-surface
       counterpart of the app's --text (docs/logo.svg), and the rest are
       hand-picked steps of it rather than mixes toward white, which would wash
       the warmth out. --_text-sec and --_line clear 4.5:1 and 3:1 on white;
       the pale steps carry no text. Overridable via --line, --accent, etc. */
    --_text:          #2a2522;
    --_text-sec:      var(--muted, #75716f);
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          var(--line, #94908c);
    --_arrow:         #504b47;
    --_node-fill:     var(--surface, #f1efec);
    --_node-stroke:   var(--border, #9c938a);
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Proj" data-label="Output Projection  W_output @ hidden">
  <rect x="383.25100000000003" y="217.6" width="205.107" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="383.25100000000003" y="217.6" width="205.107" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="395.25100000000003" y="231.6" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Output Projection  W_output @ hidden</text>
</g>
<g class="subgraph" data-id="TiedEmbed" data-label="Tied Embeddings (Gemma3)">
  <rect x="40" y="40" width="506.98299999999995" height="130.7" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="506.98299999999995" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Tied Embeddings (Gemma3)</text>
</g>
<polyline class="edge" data-from="Hidden" data-to="Proj" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="GEMV — largest op
in the entire model" points="198.877,217.6 383.25100000000003,217.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Raw" data-to="Best" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="argmax" points="942.454,341.4 1083.744,341.4" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Best" data-to="Decode" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1242.772,341.4 1290.772,341.4" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Wout" data-to="Raw" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="one dot-product
per vocabulary entry" points="485.8045,315.4 485.8045,331.4 485.80449999999996,341.4 793.8,341.4" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Shared" data-to="Saving" data-style="solid" data-arrow-start="false" data-arrow-end="false" points="221.107,119.35 277.10699999999997,119.35" fill="none" stroke="var(--_line)" stroke-width="1" />
<g class="edge-label" data-from="Hidden" data-to="Proj" data-label="GEMV — largest op
in the entire model">
  <rect x="234.877" y="194.6" width="104.37400000000002" height="44.6" rx="2" ry="2" fill="#ffffff" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="287.064" y="216.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)"><tspan x="287.064" dy="-3.3000000000000007">GEMV — largest op</tspan><tspan x="287.064" dy="14.3">in the entire model</tspan></text>
</g>
<g class="edge-label" data-from="Raw" data-to="Best" data-label="argmax">
  <rect x="986.454" y="325.4" width="53.29" height="30.3" rx="2" ry="2" fill="#ffffff" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="1013.0989999999999" y="340.54999999999995" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">argmax</text>
</g>
<g class="edge-label" data-from="Wout" data-to="Raw" data-label="one dot-product
per vocabulary entry">
  <rect x="632.358" y="318.4" width="117.44200000000004" height="44.6" rx="2" ry="2" fill="#ffffff" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="691.079" y="340.7" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)"><tspan x="691.079" dy="-3.3000000000000007">one dot-product</tspan><tspan x="691.079" dy="14.3">per vocabulary entry</tspan></text>
</g>
<g class="node" data-id="Hidden" data-label="&quot;Final Hidden State
[n_embd floats" data-shape="rectangle">
  <rect x="48" y="190.7" width="150.877" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="123.4385" y="217.6" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="123.4385" dy="-3.9000000000000012">&quot;Final Hidden State</tspan><tspan x="123.4385" dy="16.900000000000002">[n_embd floats</tspan></text>
</g>
<g class="node" data-id="Raw" data-label="&quot;Raw logit scores
[vocab_size floats" data-shape="rectangle">
  <rect x="793.8" y="314.5" width="148.654" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="868.127" y="341.4" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="868.127" dy="-3.9000000000000012">&quot;Raw logit scores</tspan><tspan x="868.127" dy="16.900000000000002">[vocab_size floats</tspan></text>
</g>
<g class="node" data-id="Best" data-label="Predicted token ID
(highest score wins)" data-shape="rectangle">
  <rect x="1083.744" y="314.5" width="159.02800000000002" height="53.800000000000004" rx="0" ry="0" fill="#a9ba9e" stroke="#5f7f4c" stroke-width="0.75" />
  <text x="1163.2579999999998" y="341.4" text-anchor="middle" font-size="13" font-weight="500" fill="#1e2b18"><tspan x="1163.2579999999998" dy="-3.9000000000000012">Predicted token ID</tspan><tspan x="1163.2579999999998" dy="16.900000000000002">(highest score wins)</tspan></text>
</g>
<g class="node" data-id="Decode" data-label="Decode to text
\&quot;Paris\&quot;" data-shape="rectangle">
  <rect x="1290.772" y="314.5" width="123.46000000000001" height="53.800000000000004" rx="0" ry="0" fill="#a9ba9e" stroke="#5f7f4c" stroke-width="0.75" />
  <text x="1352.502" y="341.4" text-anchor="middle" font-size="13" font-weight="500" fill="#1e2b18"><tspan x="1352.502" dy="-3.9000000000000012">Decode to text</tspan><tspan x="1352.502" dy="16.900000000000002">\&quot;Paris\&quot;</tspan></text>
</g>
<g class="node" data-id="Wout" data-label="&quot;W_output matrix
[vocab_size × n_embd" data-shape="rectangle">
  <rect x="399.25100000000003" y="261.6" width="173.107" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="485.8045" y="288.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="485.8045" dy="-3.9000000000000012">&quot;W_output matrix</tspan><tspan x="485.8045" dy="16.900000000000002">[vocab_size × n_embd</tspan></text>
</g>
<g class="node" data-id="Shared" data-label="&quot;Single weight matrix
[vocab_size × n_embd" data-shape="rectangle">
  <rect x="48" y="92.45" width="173.107" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="134.55349999999999" y="119.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="134.55349999999999" dy="-3.9000000000000012">&quot;Single weight matrix</tspan><tspan x="134.55349999999999" dy="16.900000000000002">[vocab_size × n_embd</tspan></text>
</g>
<g class="node" data-id="Saving" data-label="Memory saved:
vocab_size × n_embd × dtype_bytes
128K × 4096 × 2 bytes = 1 GB" data-shape="rectangle">
  <rect x="277.10699999999997" y="84" width="253.87599999999998" height="70.7" rx="0" ry="0" fill="#d2bcb6" stroke="#a97f75" stroke-width="0.75" />
  <text x="404.04499999999996" y="119.35" text-anchor="middle" font-size="13" font-weight="500" fill="#3d2520"><tspan x="404.04499999999996" dy="-12.350000000000001">Memory saved:</tspan><tspan x="404.04499999999996" dy="16.900000000000002">vocab_size × n_embd × dtype_bytes</tspan><tspan x="404.04499999999996" dy="16.900000000000002">128K × 4096 × 2 bytes = 1 GB</tspan></text>
</g>
</svg>