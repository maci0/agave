<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 987.1120000000001 199.4" width="987.1120000000001" height="199.4" style="--bg:#FFFFFF;--fg:#2A2522;background:#ffffff">
<style>
  /* Agave's own faces, the same stacks the chat UI and the wordmark use, so a
     diagram sits in the same product as the app. No webfont fetch. */
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Noto Sans', sans-serif; }
  .actor text, .subgraph text { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, 'Noto Sans Mono', monospace; }
  svg {
    /* Desert-night inks on a white canvas: --_text is the light-surface
       counterpart of the app's --text (docs/logo.svg), and the rest are
       hand-picked steps of it rather than mixes toward white, which would wash
       the warmth out. --_text-sec and --_line clear 4.5:1 and 3:1 on white;
       the pale steps carry no text. Overridable via --line, --accent, etc. */
    --_text:          #2a2522;
    --_text-sec:      var(--muted, #75716f);
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          var(--line, #94908c);
    --_arrow:         #504b47;
    --_node-fill:     var(--surface, #f1efec);
    --_node-stroke:   var(--border, #9c938a);
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
    --_inner-stroke:  #e2ded9;
    --_key-badge:     #eceae6;
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Vocab" data-label="Vocabulary (32K–256K entries)">
  <rect x="525.6460000000001" y="158.47500000000002" width="0" height="0" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="525.6460000000001" y="158.47500000000002" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="537.6460000000001" y="172.47500000000002" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Vocabulary (32K–256K entries)</text>
</g>
<polyline class="edge" data-from="Raw" data-to="Tok" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="167.16500000000002,103.57500000000002 215.16500000000002,103.57500000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Tok" data-to="IDs" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="348.25800000000004,103.57500000000002 396.25800000000004,103.57500000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="IDs" data-to="Embed" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="525.6460000000001,94.60833333333335 561.6460000000001,94.60833333333335 561.6460000000001,66.9 573.6460000000001,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Embed" data-to="Vec" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="746.753,66.9 794.753,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="IDs" data-to="Back" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="decode path" points="525.6460000000001,112.54166666666669 561.6460000000001,112.54166666666669 561.6460000000001,140.25 688.9140000000001,140.25" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="IDs" data-to="Back" data-label="decode path">
  <rect x="569.6460000000001" y="124.25" width="75.26800000000001" height="30.3" rx="2" ry="2" fill="#ffffff" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="607.2800000000001" y="139.4" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">decode path</text>
</g>
