  <text x="281.7115" y="103.57500000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#2f3f26"><tspan x="281.7115" dy="-3.9000000000000012">BPE Tokenizer</tspan><tspan x="281.7115" dy="16.900000000000002">bpe.zig</tspan></text>
</g>
