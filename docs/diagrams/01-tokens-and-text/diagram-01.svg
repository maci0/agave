  <text x="460.95200000000006" y="103.57500000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="460.95200000000006" dy="-3.9000000000000012">&quot;Token IDs</tspan><tspan x="460.95200000000006" dy="16.900000000000002">[15496, 11, 995, 0</tspan></text>
</g>
<g class="node" data-id="Embed" data-label="&quot;Embedding Table
[vocab_size × n_embd" data-shape="rectangle">
  <rect x="573.6460000000001" y="40" width="173.107" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="660.1995000000001" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="660.1995000000001" dy="-3.9000000000000012">&quot;Embedding Table</tspan><tspan x="660.1995000000001" dy="16.900000000000002">[vocab_size × n_embd</tspan></text>
</g>
