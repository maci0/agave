  <text x="870.9325" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#1e2b18"><tspan x="870.9325" dy="-3.9000000000000012">Float Vectors</tspan><tspan x="870.9325" dy="16.900000000000002">ready for the model</tspan></text>
</g>
<g class="node" data-id="Back" data-label="\&quot;Hello, world!\&quot;" data-shape="rectangle">
  <rect x="688.9140000000001" y="121.80000000000001" width="127.165" height="36.900000000000006" rx="0" ry="0" fill="#a9ba9e" stroke="#5f7f4c" stroke-width="0.75" />
  <text x="752.4965000000001" y="140.25" text-anchor="middle" font-size="13" font-weight="500" fill="#1e2b18" dy="4.55">\&quot;Hello, world!\&quot;</text>
</g>
</svg>