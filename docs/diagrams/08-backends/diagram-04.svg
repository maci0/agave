  <text x="798.5955" y="292.7" text-anchor="middle" font-size="13" font-weight="500" fill="#1e2b18" dy="4.55">GPU Compute</text>
</g>
<g class="node" data-id="SharedMem" data-label="Shared Physical Memory
(weights live here once)" data-shape="rectangle">
  <rect x="56" y="108" width="190.891" height="53.800000000000004" rx="0" ry="0" fill="#e2e5e8" stroke="#5f7480" stroke-width="0.75" />
  <text x="151.44549999999998" y="134.9" text-anchor="middle" font-size="13" font-weight="500" fill="#25333a"><tspan x="151.44549999999998" dy="-3.9000000000000012">Shared Physical Memory</tspan><tspan x="151.44549999999998" dy="16.900000000000002">(weights live here once)</tspan></text>
</g>
<g class="node" data-id="uGPU" data-label="GPU Compute" data-shape="rectangle">
  <rect x="485.00300000000004" y="84" width="121.23700000000001" height="36.900000000000006" rx="0" ry="0" fill="#a9ba9e" stroke="#5f7f4c" stroke-width="0.75" />
