  <rect x="290.89099999999996" y="79.45" width="150.11200000000002" height="44.6" rx="2" ry="2" fill="#ffffff" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="365.947" y="101.75" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)"><tspan x="365.947" dy="-3.3000000000000007">zero-copy pointer</tspan><tspan x="365.947" dy="14.3">newBufferWithBytesNoCopy</tspan></text>
</g>
<g class="edge-label" data-from="SharedMem" data-to="uCPU" data-label="normal pointer">
  <rect x="323.561" y="151.35" width="84.77200000000002" height="30.3" rx="2" ry="2" fill="#ffffff" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="365.947" y="166.5" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">normal pointer</text>
</g>
<g class="node" data-id="SysRAM" data-label="System RAM
(weights loaded here)" data-shape="rectangle">
  <rect x="56" y="265.8" width="166.438" height="53.800000000000004" rx="0" ry="0" fill="#e2e5e8" stroke="#5f7480" stroke-width="0.75" />
  <text x="139.219" y="292.7" text-anchor="middle" font-size="13" font-weight="500" fill="#25333a"><tspan x="139.219" dy="-3.9000000000000012">System RAM</tspan><tspan x="139.219" dy="16.900000000000002">(weights loaded here)</tspan></text>
</g>
