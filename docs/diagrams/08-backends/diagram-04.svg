  <text x="440.8555" y="292.7" text-anchor="middle" font-size="13" font-weight="500" fill="#4a1c1c"><tspan x="440.8555" dy="-3.9000000000000012">PCIe Bus</tspan><tspan x="440.8555" dy="16.900000000000002">~64 GB/s</tspan></text>
</g>
