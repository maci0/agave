  <text x="258.57975" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">encode gemv(W_v) [deferred]</text>
</g>
<g class="message" data-from="CPU" data-to="CMB" data-label="encode sdpa(q,k,v) [deferred]" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="159.546" y1="210" x2="357.6135" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="258.57975" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">encode sdpa(q,k,v) [deferred]</text>
</g>
<g class="message" data-from="CPU" data-to="CPU" data-label="argmax(logits) — READS STALE DATA (write hazard)" data-line-style="solid" data-arrow-head="filled" data-self="true">
