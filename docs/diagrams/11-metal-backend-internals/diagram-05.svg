</g>
<g class="message" data-from="CPU" data-to="CMB" data-label="encode gemv(lm_head) [deferred]" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="159.546" y1="350" x2="357.6135" y2="350" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="258.57975" y="340" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">encode gemv(lm_head) [deferred]</text>
</g>
<g class="message" data-from="CPU" data-to="CMB" data-label="commit() — submit all at once" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="159.546" y1="390" x2="357.6135" y2="390" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="258.57975" y="380" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">commit() — submit all at once</text>
</g>
<g class="message" data-from="CMB" data-to="GPU" data-label="execute all encoded ops" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="357.6135" y1="430" x2="563.0909999999999" y2="430" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="460.3522499999999" y="420" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">execute all encoded ops</text>
</g>
<g class="message" data-from="GPU" data-to="CPU" data-label="waitUntilCompleted() — CPU blocks here" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="563.0909999999999" y1="470" x2="159.546" y2="470" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="361.3185" y="460" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">waitUntilCompleted() — CPU blocks here</text>
</g>
<g class="message" data-from="CPU" data-to="CPU" data-label="argmax(logits) — CORRECT: reads fresh logits" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="159.546,525 189.546,525 189.546,545 159.546,545" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="197.546" y="535" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">argmax(logits) — CORRECT: reads fresh logits</text>
</g>
<g class="note" data-position="over" data-actors="CPU">
  <polygon points="44.553,218 268.539,218 274.539,224 274.539,241 44.553,241" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="268.539,218 274.539,224 268.539,224" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="159.546" y="229.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">CPU tries to read logits here WITHOUT sync</text>
</g>
<g class="note" data-position="over" data-actors="CPU,GPU">
  <polygon points="258.50249999999994,303 458.1345,303 464.1345,309 464.1345,326 258.50249999999994,326" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="458.1345,303 464.1345,309 458.1345,309" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="361.3185" y="314.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Correct pattern: sync before CPU read</text>
</g>
<g class="note" data-position="over" data-actors="CPU">
  <polygon points="30,478 283.092,478 289.092,484 289.092,501 30,501" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="283.092,478 289.092,484 283.092,484" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="159.546" y="489.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">GPU writes are now visible in UMA shared memory</text>
</g>
<g class="note" data-position="over" data-actors="CPU,GPU">
  <polygon points="266.2245,563 450.4125,563 456.4125,569 456.4125,586 266.2245,586" fill="#ffffff" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="450.4125,563 456.4125,569 450.4125,569" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="361.3185" y="574.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Total syncs per token: 1-2 (not 800+)</text>
</g>
