  <rect x="82.721" y="141.8" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="94.721" y="155.8" font-size="12" font-weight="600" fill="var(--_text-sec)"><tspan x="94.721" dy="-3.6000000000000014">Tier 1 — Fused FFN</tspan><tspan x="94.721" dy="15.600000000000001">(megakernel.metal)</tspan></text>
</g>
