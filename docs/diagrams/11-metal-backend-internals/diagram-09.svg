<polyline class="edge" data-from="T2Desc" data-to="Total" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="741.8049999999998,139.60000000000002 741.8049999999998,166.05 741.8049999999998,166.05 741.8049999999998,175.60000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
