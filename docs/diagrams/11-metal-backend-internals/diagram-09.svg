  <rect x="125.44200000000001" y="141.8" width="0" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="137.442" y="155.8" font-size="12" font-weight="600" fill="var(--_text-sec)"><tspan x="137.442" dy="-3.6000000000000014">Tier 2 — True Megakernels</tspan><tspan x="137.442" dy="15.600000000000001">(mega_common.metal)</tspan></text>
