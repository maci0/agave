    --_text-sec:      #75716f;
    --_text-muted:    #a8a4a0;
    --_text-faint:    #cbc7c3;
    --_line:          #94908c;
    --_arrow:         #504b47;
    --_node-fill:     #f1efec;
    --_node-stroke:   #9c938a;
    --_group-fill:    #ffffff;
    --_group-hdr:     #f7f5f3;
