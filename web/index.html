<!DOCTYPE html>
<!-- Browser WASM shell (standalone). Distinct from src/web/ (HTTP --serve chat UI). -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>agave - Browser LLM Inference</title>
    <!-- Tokens and components are shared with the serve UI (src/web/ui/theme.css),
         so both chat surfaces read as one product. style.css is a committed build
         output: regenerate it with scripts/build-web.sh. -->
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#1a1714">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Run LLM inference directly in your browser via WebAssembly. Load a GGUF model and chat, no server required.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='-62%20-86%20124%20124'%20fill='none'%20stroke='%238faa7b'%20stroke-linecap='round'%3E%3Cpath%20stroke-width='6'%20d='M0-70Q5-35%200%200'/%3E%3Cpath%20stroke-width='5'%20d='M0%200Q-20-30-15-65'/%3E%3Cpath%20stroke-width='5'%20d='M0%200Q20-30%2015-65'/%3E%3Cpath%20stroke-width='4.5'%20d='M0%200Q-30-20-35-50'/%3E%3Cpath%20stroke-width='4.5'%20d='M0%200Q30-20%2035-50'/%3E%3Cpath%20stroke-width='4'%20d='M0%205Q-35-5-48-25'/%3E%3Cpath%20stroke-width='4'%20d='M0%205Q35-5%2048-25'/%3E%3Cpath%20stroke-width='3.5'%20d='M0%2010Q-38%205-55-8'/%3E%3Cpath%20stroke-width='3.5'%20d='M0%2010Q38%205%2055-8'/%3E%3C/svg%3E">
</head>
<body>
    <noscript><p style="padding:2rem;color:#e8a0a0;text-align:center">JavaScript is required to run Agave in the browser.</p></noscript>
    <!-- The shell is a React tree (web/shell.tsx). agave.js loads first: it puts
         AgaveEngine and AgaveError on globalThis, which the shell consumes. -->
    <div id="root"></div>
    <script src="agave.js" defer></script>
    <script src="shell.js" defer></script>
</body>
</html>
