<!DOCTYPE html>
<!-- Browser WASM shell (standalone). Distinct from src/web/ (the HTTP serve chat UI). -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>agave - Browser LLM Engine (init, parse, tokenize)</title>
    <!-- Tokens and components are shared with the serve UI (src/web/ui/theme.css),
         so both chat surfaces read as one product. style.css is a committed build
         output: regenerate it with scripts/build-web.sh. -->
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
    <meta name="color-scheme" content="light dark">
<!-- The shell fetches GGUF files from whatever URL the reader pastes. Same
     policy as the serve UI (src/web/head.html): do not hand the local page URL
     to a third-party model host. -->
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="Load a GGUF model in the browser and tokenize prompts with agave compiled to WebAssembly. This build stops before text generation.">

<body>
    <noscript><p class="p-8 text-center text-destructive-foreground">JavaScript is required to run Agave in the browser.</p></noscript>
    <!-- The shell is a React tree (web/shell.tsx). agave.js loads first: it puts
         AgaveEngine and AgaveError on globalThis, which the shell consumes. -->
    <div id="root"></div>
    <script src="agave.js" defer></script>
    <script src="shell.js" defer></script>
</body>
</html>
