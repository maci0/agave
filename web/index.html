<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agave — Browser LLM Inference</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 1rem 2rem; background: #16213e; border-bottom: 1px solid #333; }
        header h1 { font-size: 1.2rem; color: #4a8c2a; }
        header small { color: #888; }
        #chat { flex: 1; overflow-y: auto; padding: 1rem 2rem; }
        .msg { margin: 0.5rem 0; padding: 0.75rem 1rem; border-radius: 8px; max-width: 80%; }
        .msg.user { background: #1a3a5c; margin-left: auto; }
        .msg.assistant { background: #2a2a3e; }
        #controls { padding: 1rem 2rem; background: #16213e; border-top: 1px solid #333; display: flex; gap: 0.5rem; }
        #prompt { flex: 1; padding: 0.75rem; border: 1px solid #444; border-radius: 8px; background: #1a1a2e; color: #e0e0e0; font-size: 1rem; }
        button { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; background: #4a8c2a; color: white; cursor: pointer; font-size: 1rem; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status { padding: 0.5rem 2rem; background: #111; color: #888; font-size: 0.85rem; }
        #model-input { padding: 0.5rem 2rem; background: #16213e; }
        #model-input input { width: 100%; padding: 0.5rem; border: 1px solid #444; border-radius: 4px; background: #1a1a2e; color: #e0e0e0; }
    </style>
</head>
<body>
    <header>
        <h1>agave</h1>
        <small>LLM inference in the browser via WebAssembly</small>
    </header>
    <div id="model-input">
        <input type="text" id="model-url" placeholder="Model URL (GGUF) or drag & drop file..." />
        <button onclick="loadModel()" id="load-btn">Load Model</button>
    </div>
    <div id="status">Status: Not initialized</div>
    <div id="chat"></div>
    <div id="controls">
        <input type="text" id="prompt" placeholder="Type a message..." disabled />
        <button onclick="send()" id="send-btn" disabled>Send</button>
    </div>

    <script src="agave.js"></script>
    <script>
        const engine = new AgaveEngine();
        const chat = document.getElementById('chat');
        const status = document.getElementById('status');
        const promptInput = document.getElementById('prompt');

        async function loadModel() {
            const url = document.getElementById('model-url').value;
            if (!url) return;

            status.textContent = 'Status: Initializing WASM engine...';
            try {
                await engine.init();
                status.textContent = 'Status: Downloading model...';
                await engine.loadModel(url);
                status.textContent = 'Status: Ready';
                promptInput.disabled = false;
                document.getElementById('send-btn').disabled = false;
            } catch (e) {
                status.textContent = `Error: ${e.message}`;
            }
        }

        async function send() {
            const text = promptInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            promptInput.value = '';
            promptInput.disabled = true;
            status.textContent = 'Status: Generating...';

            try {
                const output = await engine.generate(text, { maxTokens: 200 });
                addMessage('assistant', output);
            } catch (e) {
                addMessage('assistant', `Error: ${e.message}`);
            }

            promptInput.disabled = false;
            status.textContent = 'Status: Ready';
            promptInput.focus();
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });
    </script>
</body>
</html>
