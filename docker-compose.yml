# Local HTTP server. Copy .env.example to .env and set AGAVE_API_KEY + model path.
# Usage:
#   cp .env.example .env   # then edit AGAVE_API_KEY and AGAVE_MODEL
#   docker compose up --build
# One-shot CLI inference: docker run --rm --no-healthcheck -v ... agave:local /models/model.gguf "prompt"

services:
  agave:
    build:
      context: .
      args:
        # Fast local image: CPU + Gemma4 only (override in compose.override.yml if needed).
        ENABLE_CUDA: "false"
        ENABLE_VULKAN: "false"
        ENABLE_ROCM: "false"
        ENABLE_WEBGPU: "false"
        ENABLE_DEBUG: "false"
        ENABLE_QWEN35: "false"
        ENABLE_QWEN4EXP: "false"
        ENABLE_QWEN4_EXP: "false"
        ENABLE_GEMMA4: "false"
        ENABLE_DIFFUSION_GEMMA: "false"
        ENABLE_DEEPSEEK4: "false"
        ENABLE_LLAMA4: "false"
        ENABLE_DFLASH2: "false"
    image: agave:local
    # Match Dockerfile USER agave (uid/gid 10001); keeps tmpfs mounts consistent.
    user: "10001:10001"
    # Default to loopback publish so the API is not exposed on LAN interfaces.
    # Set AGAVE_HOST_BIND=0.0.0.0 in .env only when you intentionally need remote access.
    ports:
      - "${AGAVE_HOST_BIND:-127.0.0.1}:${AGAVE_PORT:-49453}:${AGAVE_PORT:-49453}"
    # Compose auto-loads ./.env for ${VAR} substitution; pass only what the process needs.
    environment:
      AGAVE_PORT: ${AGAVE_PORT:-49453}
      AGAVE_API_KEY: ${AGAVE_API_KEY:?Set AGAVE_API_KEY in .env (see .env.example)}
      # Optional; empty is treated as unset (HF_TOKEN, HF_ENDPOINT, NO_COLOR,
      # AGAVE_VISION_DEBUG, AGAVE_DF2_DEBUG). Compose-only vars
      # (AGAVE_HOST_BIND, AGAVE_MODELS_DIR, AGAVE_CACHE_DIR, AGAVE_MODEL)
      # are consumed here, not forwarded. HF_HOME and XDG_CACHE_HOME stay
      # out: the named volume replaces ~/.cache, and image HOME is set below.
      HF_TOKEN: ${HF_TOKEN:-}
      # Mirror or air-gapped Hub gateway; empty keeps huggingface.co.
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      NO_COLOR: ${NO_COLOR:-}
      AGAVE_VISION_DEBUG: ${AGAVE_VISION_DEBUG:-}
      AGAVE_DF2_DEBUG: ${AGAVE_DF2_DEBUG:-}
      # Match image ENV HOME (Hub pulls, Vulkan cache, conversation store).
      HOME: /home/agave
    volumes:
      - ${AGAVE_MODELS_DIR:-./models}:/models:ro
      # Survives container replace: conversation store, Vulkan pipeline cache,
      # HuggingFace / agave pull blobs (HOME is otherwise tmpfs).
      # This volume is the ONLY copy of the conversation store. `down -v` and a
      # pruned Docker data root delete it with no undo. Back it up to another
      # filesystem: docs/DURABILITY.md, or
      #   docker run --rm --entrypoint conv-store-backup.sh \
      #     -v agave-cache:/home/agave/.cache:ro -v "$PWD/backups:/backups" \
      #     -e AGAVE_BACKUP_DIR=/backups agave:local backup
      # and schedule the same command with `check` to alert on a stopped job.
      - ${AGAVE_CACHE_DIR:-agave-cache}:/home/agave/.cache
    # ENTRYPOINT is already: agave --host 0.0.0.0
    command: ["${AGAVE_MODEL:-/models/model.gguf}", "--serve"]
    restart: unless-stopped
    # SIGTERM starts a graceful drain (server.zig): the server logs a warning
    # once in-flight connections have held it for 30s but keeps waiting for
    # them, so it only exits when they finish. This budget must cover the
    # longest in-flight request; past it compose SIGKILLs mid-stream.
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/agave:size=64m,uid=10001,gid=10001,mode=0755
      # POSIX shm transport (--transport auto on localhost peers, the
      # zero-copy same-node IPC the README advertises) allocates one 16 MiB
      # region per direction per rank pair: 32 MiB for TP=2, 64 MiB for TP=4.
      # Docker's default /dev/shm is 64 MiB and is not sized by this file's
      # read_only/tmpfs list, so a TP=4 run fills it and shm_open fails with
      # ENOSPC. Size it above the world_size you intend to run; 512m covers
      # TP=8 plus headroom for anything else in the container's /dev/shm.
      - /dev/shm:size=512m
    mem_limit: 8g
    cpus: "4.0"
    pids_limit: 256
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Inherits image HEALTHCHECK (/ready). Explicit here so compose overrides stay clear.
    # start_period allows slow model load before probes count as failures.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:$${AGAVE_PORT:-49453}/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  agave-cache:
