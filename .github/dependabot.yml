version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      oxlint:
        patterns:
          - "oxlint*"
          - "@oxlint/*"
          - "@rikalabs/oxlint-standards"

  - package-ecosystem: "uv"
    directory: "/research/kernels"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/research/kernels/tilelang"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
