version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      oxlint:
        patterns:
          - "oxlint*"
          - "@oxlint/*"
          - "@rikalabs/oxlint-standards"

  - package-ecosystem: "uv"
    directory: "/research/kernels"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/research/kernels/tilelang"
    schedule:
      interval: "weekly"

  # uv, not pip: this directory ships a uv.lock that `zig build check-pins`
  # compares against tests/pyproject.toml. A pip-ecosystem bump edits the
  # manifest without relocking, and the next gate run fails on the stale lock.
  - package-ecosystem: "uv"
    directory: "/tests"
    schedule:
      interval: "weekly"
