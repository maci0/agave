# The JavaScript lockfile is bun.lock, which this npm entry cannot read:
# Dependabot aborts with "detected that Bun is misconfigured" and "This
# project has a `bun.lock` file but no `package-lock.json`, `yarn.lock` or
# `pnpm-lock.yaml`". Renovate's npm manager reads bun.lock, so renovate.json
# owns those packages, oxlint group included.
version: 2
# Cap open Dependabot PRs so the grouped github-actions / docker / uv / pip
# bumpers cannot pile up stale, conflicting PRs (and the CI runners they
# spend, including the 60-min test/docker jobs) ahead of the weekly
# schedule. Five is a reviewable queue, not a silent drop: Dependabot
# keeps the newest PRs once older ones merge or close.
open-pull-requests-limit: 5
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/research/kernels"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/research/kernels/tilelang"
    schedule:
      interval: "weekly"

  # uv, not pip: this directory ships a uv.lock that `zig build check-pins`
  # compares against tests/pyproject.toml. A pip-ecosystem bump edits the
  # manifest without relocking, and the next gate run fails on the stale lock.
  - package-ecosystem: "uv"
    directory: "/tests"
    schedule:
      interval: "weekly"
