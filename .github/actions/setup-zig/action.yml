name: 'Setup pinned Zig'
description: 'Reads the toolchain pin from .zigversion (single source of truth) and installs that Zig version. Exposes it as the `version` output for cache keys.'
outputs:
  version:
    description: 'Zig version read from .zigversion'
    value: ${{ steps.zig.outputs.version }}
runs:
  using: 'composite'
  steps:
    - name: Read Zig version
      id: zig
      shell: bash
      run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
      with:
        version: ${{ steps.zig.outputs.version }}
