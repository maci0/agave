name: Golden Tests

on:
  # Golden tests need model weights, which GitHub-hosted runners do not have.
  # Dispatch with `runner` set to a self-hosted label (e.g. "self-hosted,linux,agave-models")
  # whose checkout has ./models mounted. A single `runs-on` string can name
  # several labels only as one comma-separated value; the matrix CPU/Metal/Vulkan
  # legs then share that runner. Left empty, the matrix falls back to the
  # GitHub-hosted labels, where the "Require local GGUF models" step fails by design.
  workflow_dispatch:
    inputs:
      runner:
        description: "Self-hosted runner label(s) (comma-separated, e.g. self-hosted,linux,agave-models). Empty uses the GitHub-hosted runner from the matrix (no model weights)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: golden-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C
  TZ: UTC

jobs:
  golden-tests:
    name: Golden Tests - ${{ matrix.backend }}
    runs-on: ${{ inputs.runner || matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: CPU
            runner: ubuntu-24.04
            cache-suffix: linux
          - backend: Metal
            runner: macos-15
            cache-suffix: macos
          - backend: Vulkan
            runner: ubuntu-24.04
            cache-suffix: vulkan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Install Vulkan SDK
        # GitHub-hosted runners have no Vulkan loader. A self-hosted runner
        # supplies its own driver and SDK, so skip the LunarG apt install there.
        # scripts/install-vulkan-sdk.sh is the single entry point, so
        # `zig build lint-shell` analyses it.
        if: matrix.backend == 'Vulkan' && inputs.runner == ''
        run: bash scripts/install-vulkan-sdk.sh

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ${{ runner.os == 'macOS' && '~/Library/Caches/zig' || '~/.cache/zig' }}
          # Hash all of src/ (embedded kernels + src/web UI), not only *.zig.
          key: zig-${{ steps.zig.outputs.version }}-golden-${{ matrix.cache-suffix }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'tests/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-golden-${{ matrix.cache-suffix }}-

      - name: Require local GGUF models
        run: bash scripts/check-golden-models.sh

      - name: Build Agave
        run: zig build

      - name: Run golden tests (${{ matrix.backend }} backend)
        # Env indirection, not ${{ }} interpolation: the backend name must never
        # be spliced into a shell body.
        env:
          BACKEND: ${{ matrix.backend }}
        run: bash scripts/run-golden-tests.sh "$BACKEND"
