name: Golden Tests

on:
  # Golden tests need model weights, which GitHub-hosted runners do not have.
  # Dispatch with `runner` set to a self-hosted label (e.g. "self-hosted",
  # or "self-hosted,linux,agave-models") whose checkout has ./models mounted.
  # Left empty, the matrix falls back to the GitHub-hosted labels, where the
  # "Require local GGUF models" step fails by design.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label to dispatch to. Empty uses the GitHub-hosted runner from the matrix (no model weights)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: golden-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C
  TZ: UTC

jobs:
  golden-tests:
    name: Golden Tests - ${{ matrix.backend }}
    runs-on: ${{ inputs.runner || matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: CPU
            runner: ubuntu-24.04
            cache-suffix: linux
          - backend: Metal
            runner: macos-15
            cache-suffix: macos
          - backend: Vulkan
            runner: ubuntu-24.04
            cache-suffix: vulkan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Install Vulkan SDK
        # GitHub-hosted runners have no Vulkan loader. A self-hosted runner
        # supplies its own driver and SDK, so skip the LunarG apt install there.
        if: matrix.backend == 'Vulkan' && inputs.runner == ''
        run: |
          set -euo pipefail
          sudo install -dm755 /etc/apt/keyrings
          # Pin LunarG archive key by fingerprint (avoid trusting a bare wget of the key URL alone).
          KEY_URL="https://packages.lunarg.com/lunarg-signing-key-pub.asc"
          EXPECTED_FP="03F5D621A3710FA95A93D89BAA8452080E383F7E"
          curl -fsSL "$KEY_URL" -o /tmp/lunarg-archive-keyring.asc
          FP="$(gpg --show-keys --with-colons /tmp/lunarg-archive-keyring.asc | awk -F: '/^fpr:/ {print $10; exit}')"
          if [[ "$FP" != "$EXPECTED_FP" ]]; then
            echo "::error::LunarG apt key fingerprint mismatch: got $FP expected $EXPECTED_FP"
            exit 1
          fi
          sudo install -m644 /tmp/lunarg-archive-keyring.asc /etc/apt/keyrings/lunarg-archive-keyring.asc
          CODENAME=$(lsb_release -cs)
          echo "deb [signed-by=/etc/apt/keyrings/lunarg-archive-keyring.asc] https://packages.lunarg.com/vulkan/ ${CODENAME} main" | sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends vulkan-sdk

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ${{ runner.os == 'macOS' && '~/Library/Caches/zig' || '~/.cache/zig' }}
          # Hash all of src/ (embedded kernels + src/web UI), not only *.zig.
          key: zig-${{ steps.zig.outputs.version }}-golden-${{ matrix.cache-suffix }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'tests/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-golden-${{ matrix.cache-suffix }}-

      - name: Require local GGUF models
        run: bash scripts/check-golden-models.sh

      - name: Build Agave
        run: zig build

      - name: Run golden tests (${{ matrix.backend }} backend)
        # Env indirection, not ${{ }} interpolation: the backend name must never
        # be spliced into a shell body.
        env:
          BACKEND: ${{ matrix.backend }}
        run: bash scripts/run-golden-tests.sh "$BACKEND"
