name: Golden Tests

on:
  # Golden tests require model files not available on GitHub-hosted runners.
  # Run manually or on self-hosted runners with models at models/.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-tests:
    name: Golden Tests - ${{ matrix.backend }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: CPU
            runner: ubuntu-latest
            cache-suffix: linux
          - backend: Metal
            runner: macos-latest
            cache-suffix: macos
          - backend: Vulkan
            runner: ubuntu-latest
            cache-suffix: vulkan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Install Vulkan SDK
        if: matrix.backend == 'Vulkan'
        run: |
          set -euo pipefail
          sudo install -dm755 /etc/apt/keyrings
          # Pin LunarG archive key by fingerprint (avoid trusting a bare wget of the key URL alone).
          KEY_URL="https://packages.lunarg.com/lunarg-signing-key-pub.asc"
          EXPECTED_FP="03F5D621A3710FA95A93D89BAA8452080E383F7E"
          curl -fsSL "$KEY_URL" -o /tmp/lunarg-archive-keyring.asc
          FP="$(gpg --show-keys --with-colons /tmp/lunarg-archive-keyring.asc | awk -F: '/^fpr:/ {print $10; exit}')"
          if [[ "$FP" != "$EXPECTED_FP" ]]; then
            echo "::error::LunarG apt key fingerprint mismatch: got $FP expected $EXPECTED_FP"
            exit 1
          fi
          sudo install -m644 /tmp/lunarg-archive-keyring.asc /etc/apt/keyrings/lunarg-archive-keyring.asc
          CODENAME=$(lsb_release -cs)
          echo "deb [signed-by=/etc/apt/keyrings/lunarg-archive-keyring.asc] https://packages.lunarg.com/vulkan/ ${CODENAME} main" | sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends vulkan-sdk

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ${{ runner.os == 'macOS' && '~/Library/Caches/zig' || '~/.cache/zig' }}
          # Hash all of src/ (embedded kernels + src/web UI), not only *.zig.
          key: zig-${{ steps.zig.outputs.version }}-golden-${{ matrix.cache-suffix }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'tests/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-golden-${{ matrix.cache-suffix }}-

      - name: Require local GGUF models
        run: |
          # Hosted runners have no weights; self-hosted / manual runs must provide models/.
          if ! find models -type f \( -name '*.gguf' -o -name '*.GGUF' \) 2>/dev/null | grep -q .; then
            echo "::error::Golden tests need at least one .gguf under models/. Use a self-hosted runner with models mounted, or place weights under ./models before workflow_dispatch."
            exit 1
          fi
          echo "Found GGUF models under models/"

      - name: Build Agave
        run: zig build

      - name: Run golden tests (${{ matrix.backend }} backend)
        run: |
          set +e
          rc=0
          failed=""
          shopt -s nullglob
          test_files=(tests/models/test_*.zig)
          if [[ ${#test_files[@]} -eq 0 ]]; then
            echo "::error::No golden test files matched tests/models/test_*.zig"
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            echo "::group::$(basename "$test_file")"
            if zig test "$test_file" --test-filter "${{ matrix.backend }}"; then
              echo "PASS: $test_file"
            else
              rc=1
              failed="$failed $(basename "$test_file")"
              echo "::error::FAIL: $test_file (${{ matrix.backend }} backend)"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed golden tests:$failed"
          fi
          exit $rc
