name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.planning/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.planning/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-check:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Check Zig version pins agree
        env:
          # Env indirection, not ${{ }} interpolation: step outputs derived from
          # repo files must never be spliced into a shell command (injection).
          ZIG_PIN: ${{ steps.zig.outputs.version }}
        run: |
          set -euo pipefail
          pin="$ZIG_PIN"
          zon="$(sed -n 's/^[[:space:]]*\.minimum_zig_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon | head -n1)"
          if [[ -z "$zon" ]]; then
            echo "::error::Could not parse minimum_zig_version from build.zig.zon"
            exit 1
          fi
          if [[ "$pin" != "$zon" ]]; then
            echo "::error::.zigversion ($pin) != build.zig.zon minimum_zig_version ($zon)"
            exit 1
          fi
          echo "Zig pin OK: $pin"
          # Dated debian:bookworm-YYYYMMDD-slim must match DEBIAN_SNAPSHOT=YYYYMMDDT...
          from_day="$(sed -n 's/.*debian:bookworm-\([0-9]\{8\}\)-slim.*/\1/p' Dockerfile | head -n1)"
          snap_day="$(sed -n 's/.*DEBIAN_SNAPSHOT=\([0-9]\{8\}\)T.*/\1/p' Dockerfile | head -n1)"
          if [[ -z "$from_day" || -z "$snap_day" ]]; then
            echo "::error::Could not parse debian FROM tag day and DEBIAN_SNAPSHOT from Dockerfile"
            exit 1
          fi
          if [[ "$from_day" != "$snap_day" ]]; then
            echo "::error::Dockerfile debian day ($from_day) != DEBIAN_SNAPSHOT day ($snap_day)"
            exit 1
          fi
          epoch="$(sed -n 's/^ARG SOURCE_DATE_EPOCH=\([0-9][0-9]*\).*/\1/p' Dockerfile | head -n1)"
          expected_epoch="$(date -u -d "${from_day:0:4}-${from_day:4:2}-${from_day:6:2} 00:00:00 UTC" +%s)"
          if [[ -z "$epoch" ]]; then
            echo "::error::Could not parse ARG SOURCE_DATE_EPOCH from Dockerfile"
            exit 1
          fi
          if [[ "$epoch" != "$expected_epoch" ]]; then
            echo "::error::Dockerfile SOURCE_DATE_EPOCH ($epoch) != midnight UTC of debian day $from_day ($expected_epoch)"
            exit 1
          fi
          echo "Debian snapshot day OK: $from_day (SOURCE_DATE_EPOCH=$epoch)"

      - name: Check formatting
        run: zig fmt --check src/ tests/ build.zig build.zig.zon

  test-linux-x86:
    name: Test on Linux x86_64
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          # Hash all of src/ (embedded .metal/.spv/.wgsl/.ptx/.hsaco + src/web UI), not only *.zig.
          key: zig-${{ steps.zig.outputs.version }}-linux-x86-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'tests/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-linux-x86-

      - name: Run tests
        run: zig build test

  test-macos:
    name: Test on macOS (Apple Silicon)
    needs: fmt-check
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/Library/Caches/zig
          # Hash all of src/ (embedded kernels + src/web UI), not only *.zig.
          key: zig-${{ steps.zig.outputs.version }}-macos-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'tests/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-macos-

      - name: Run tests
        run: zig build test

  docker-build:
    name: Verify Docker build
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # GHA cache export for buildx requires actions: write.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image (CPU-only, single model)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: agave:ci
          build-args: |
            ENABLE_CUDA=false
            ENABLE_VULKAN=false
            ENABLE_ROCM=false
            ENABLE_WEBGPU=false
            ENABLE_DEBUG=false
            ENABLE_QWEN35=false
            ENABLE_QWEN4_EXP=false
            ENABLE_GPT_OSS=false
            ENABLE_NEMOTRON_H=false
            ENABLE_NEMOTRON_NANO=false
            ENABLE_GLM4=false
            ENABLE_GEMMA4=false
            ENABLE_DIFFUSION_GEMMA=false
            ENABLE_DEEPSEEK4=false
            ENABLE_LLAMA4=false
            ENABLE_DFLASH2=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test binary
        run: |
          set -euo pipefail
          docker run --rm --entrypoint agave agave:ci --help
          # Runtime image must not run as root (Dockerfile USER agave, uid 10001).
          uid="$(docker run --rm --entrypoint id agave:ci -u)"
          if [[ "$uid" != "10001" ]]; then
            echo "::error::Container uid=$uid; expected USER agave (uid 10001)"
            exit 1
          fi
          echo "Container uid=$uid (non-root ok)"
          # HEALTHCHECK must probe /ready (not /health) so orchestrators do not
          # route to degraded instances. One-shot CLI runs should pass --no-healthcheck.
          hc="$(docker inspect --format='{{json .Config.Healthcheck.Test}}' agave:ci)"
          if [[ "$hc" != *"/ready"* ]]; then
            echo "::error::Image HEALTHCHECK missing /ready probe: $hc"
            exit 1
          fi
          echo "HEALTHCHECK ok: $hc"
          # GPL requires the license to accompany the binary.
          if ! docker run --rm --entrypoint cat agave:ci /usr/share/doc/agave/copyright | grep -q "GNU GENERAL PUBLIC LICENSE"; then
            echo "::error::Runtime image missing GPL license at /usr/share/doc/agave/copyright"
            exit 1
          fi
          echo "LICENSE ok: /usr/share/doc/agave/copyright"
          # HOME must be set in the image config (k8s/podman do not copy passwd HOME).
          home="$(docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' agave:ci | sed -n 's/^HOME=//p')"
          if [[ "$home" != "/home/agave" ]]; then
            echo "::error::Image HOME='$home'; expected /home/agave"
            exit 1
          fi
          echo "HOME ok: $home"
          lic="$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.licenses"}}' agave:ci)"
          if [[ "$lic" != "GPL-3.0-or-later" ]]; then
            echo "::error::OCI licenses label is '$lic'; expected GPL-3.0-or-later"
            exit 1
          fi
          echo "OCI licenses ok: $lic"
          # All dlopen backends disabled above → Dockerfile must select musl static.
          ldd_out="$(docker run --rm --entrypoint ldd agave:ci /usr/local/bin/agave 2>&1 || true)"
          echo "$ldd_out"
          if echo "$ldd_out" | grep -qiE '=>|libc\.so'; then
            echo "::error::Expected static musl binary when CUDA/Vulkan/ROCm/WebGPU are disabled"
            exit 1
          fi
          if ! echo "$ldd_out" | grep -qiE 'not a dynamic|statically linked'; then
            echo "::error::Unexpected ldd output (expected static binary): $ldd_out"
            exit 1
          fi
          echo "Static musl binary ok"

  cross-compile-check:
    name: Cross-compilation matrix
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos
          # README documents both static musl builds; keep them compiling.
          - x86_64-linux-musl
          - aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ steps.zig.outputs.version }}-cross-${{ matrix.target }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-cross-${{ matrix.target }}-

      - name: Build for target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          args=(-Dtarget="$TARGET")
          # Metal is macOS-only and unavailable on Linux runners; disable for macOS cross-compile.
          if [[ "$TARGET" == *"-macos" ]]; then
            args+=(-Denable-metal=false)
          fi
          # Static musl builds are CPU-only: the dlopen backends load
          # glibc-linked .so files (README "Static musl builds").
          if [[ "$TARGET" == *"-musl" ]]; then
            args+=(-Denable-metal=false -Denable-vulkan=false -Denable-cuda=false -Denable-rocm=false -Denable-webgpu=false)
          fi
          zig build "${args[@]}"

  # wasm32-freestanding is a separate build step, so the cross-compile matrix
  # (which only varies -Dtarget) never touches it. Untested it rots: the
  # baseline wasm32 CPU has no 64-bit atomics, and a plain
  # std.atomic.Value(i64) anywhere in the graph is a compile error there.
  wasm-build:
    name: Build WASM module
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ steps.zig.outputs.version }}-wasm-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-wasm-

      - name: Build agave.wasm
        run: |
          set -euo pipefail
          zig build wasm
          test -s zig-out/web/agave.wasm

  # Rebuild-and-compare check for committed kernel binaries (CUDA PTX).
  # These artifacts are @embedFile'd but NOT rebuilt by `zig build`, so a
  # kernel-source edit without regeneration ships stale GPU code (this has
  # already happened: committed all.ptx predates deltanet_recurrence.zig).
  # Blocking since the tree was regenerated (2026-08): PTX comes from the
  # pinned zig 0.16.0 nvptx backend, so fresh builds are byte-identical on
  # any runner. SPIR-V checking is local-only for now (needs
  # glslangValidator, see scripts/check-shader-artifacts.sh) because runner
  # glslang versions are not pinned and its output embeds the generator
  # version.
  kernel-artifacts:
    name: Kernel artifact freshness
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ steps.zig.outputs.version }}-ptx-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-ptx-

      - name: Compare committed PTX against fresh build
        run: scripts/check-shader-artifacts.sh --ptx-only

  fuzz-smoke:
    name: Fuzz smoke (parsers + API surfaces)
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ steps.zig.outputs.version }}-fuzz-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'tests/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-fuzz-

      - name: Run bounded fuzz pass
        # --fuzz=N runs coverage-guided mutation for N iterations then exits.
        # Focus on untrusted-input surfaces (JSON, GGUF, image, grammar, CLI).
        run: zig build test --fuzz=1000 --summary all

  ci-pass:
    name: CI passed
    if: always()
    needs: [fmt-check, test-linux-x86, test-macos, docker-build, cross-compile-check, wasm-build, fuzz-smoke, kernel-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify all jobs passed
        run: |
          set -euo pipefail
          # Require every needed job == success (skipped/cancelled must not green the gate).
          for pair in \
            "fmt-check:${{ needs.fmt-check.result }}" \
            "test-linux-x86:${{ needs.test-linux-x86.result }}" \
            "test-macos:${{ needs.test-macos.result }}" \
            "docker-build:${{ needs.docker-build.result }}" \
            "cross-compile-check:${{ needs.cross-compile-check.result }}" \
            "wasm-build:${{ needs.wasm-build.result }}" \
            "fuzz-smoke:${{ needs.fuzz-smoke.result }}" \
            "kernel-artifacts:${{ needs.kernel-artifacts.result }}"
          do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [[ "$result" != "success" ]]; then
              echo "::error::Required CI job '$name' result was '$result' (expected success)"
              exit 1
            fi
          done
          echo "All required CI jobs succeeded"
