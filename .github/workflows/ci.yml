name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.planning/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.planning/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-check:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Read Zig version
        id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Check formatting
        run: zig fmt --check src/ tests/ build.zig build.zig.zon

  test-linux-x86:
    name: Test on Linux x86_64
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Read Zig version
        id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Cache Zig build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ steps.zig.outputs.version }}-linux-x86-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig', 'tests/**/*.zig') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-linux-x86-

      - name: Run tests
        run: zig build test

  test-macos:
    name: Test on macOS (Apple Silicon)
    needs: fmt-check
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Read Zig version
        id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Cache Zig build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .zig-cache
            ~/Library/Caches/zig
          key: zig-${{ steps.zig.outputs.version }}-macos-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig', 'tests/**/*.zig') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-macos-

      - name: Run tests
        run: zig build test

  docker-build:
    name: Verify Docker build
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # GHA cache export for buildx requires actions: write.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image (CPU-only, single model)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: agave:ci
          build-args: |
            ENABLE_CUDA=false
            ENABLE_VULKAN=false
            ENABLE_ROCM=false
            ENABLE_WEBGPU=false
            ENABLE_DEBUG=false
            ENABLE_QWEN35=false
            ENABLE_GPT_OSS=false
            ENABLE_NEMOTRON_H=false
            ENABLE_NEMOTRON_NANO=false
            ENABLE_GLM4=false
            ENABLE_GEMMA4=false
            ENABLE_DIFFUSION_GEMMA=false
            ENABLE_LLAMA4=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test binary
        run: docker run --rm --entrypoint agave agave:ci --help

  cross-compile-check:
    name: Cross-compilation matrix
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Read Zig version
        id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Cache Zig build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ steps.zig.outputs.version }}-cross-${{ matrix.target }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-cross-${{ matrix.target }}-

      - name: Build for target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          FLAGS="-Dtarget=$TARGET"
          # Metal is macOS-only and unavailable on Linux runners; disable for macOS cross-compile.
          if [[ "$TARGET" == *"-macos" ]]; then
            FLAGS="$FLAGS -Denable-metal=false"
          fi
          zig build $FLAGS

  fuzz-smoke:
    name: Fuzz smoke (parsers + API surfaces)
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Read Zig version
        id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Cache Zig build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ steps.zig.outputs.version }}-fuzz-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig', 'tests/**/*.zig') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-fuzz-

      - name: Run bounded fuzz pass
        # --fuzz=N runs coverage-guided mutation for N iterations then exits.
        # Focus on untrusted-input surfaces (JSON, GGUF, image, grammar, CLI).
        run: zig build test --fuzz=500 --summary all

  ci-pass:
    name: CI passed
    if: always()
    needs: [fmt-check, test-linux-x86, test-macos, docker-build, cross-compile-check, fuzz-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed or were cancelled"
            exit 1
          fi
