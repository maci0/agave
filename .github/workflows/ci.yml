name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      # ...except the notices for the shipped web bundle. They are markdown,
      # but fmt-check gates them (check-third-party-notices.py), they are
      # copied into the runtime image, and dropping an entry for a package
      # still in package.json must be red. The negation is re-inclusion by
      # path-filter order, so it has to stay after the '**/*.md' it overrides.
      - '!THIRD_PARTY_NOTICES.md'
      - 'docs/**'
      - 'LICENSE'
      - '.planning/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '!THIRD_PARTY_NOTICES.md'
      - 'docs/**'
      - 'LICENSE'
      - '.planning/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are wasted work worth killing; a run on main is the
  # record of what landed, so let it finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  LC_ALL: C
  TZ: UTC

jobs:
  fmt-check:
    name: Check formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig

      # Shared with `zig build check` (scripts/check-pins.sh), so a green local
      # gate cannot disagree with CI on the reproducibility pins.
      - name: Check Zig and Docker reproducibility pins agree
        run: scripts/check-pins.sh

      # src/web/app.js and web/shell.js are minified bundles of React, Radix
      # and friends. The bundler strips their license headers, so this file is
      # the only record that travels with them; a dependency bump that is not
      # listed there ships third-party code with no traceable grant.
      - name: Third-party notices cover the shipped bundles
        run: python3 scripts/check-third-party-notices.py

      - name: Check formatting
        run: zig fmt --check src/ tests/ build.zig build.zig.zon

  test-linux-x86:
    name: Test on Linux x86_64
    needs: fmt-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          # Hash all of src/ (embedded .metal/.spv/.wgsl/.ptx/.hsaco + src/web UI), not only *.zig.
          key: zig-${{ steps.zig.outputs.version }}-linux-x86-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'tests/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-linux-x86-

      - name: Run tests
        run: zig build test

      # Backup and restore of the conversation store, the only state Agave
      # cannot regenerate. Kept in the Linux job because the script is the GNU
      # find/stat it is written against (docs/DURABILITY.md).
      - name: Conversation store backup and restore
        run: zig build conv-store-backup-test

  test-macos:
    name: Test on macOS (Apple Silicon)
    needs: fmt-check
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/Library/Caches/zig
          # Hash all of src/ (embedded kernels + src/web UI), not only *.zig.
          key: zig-${{ steps.zig.outputs.version }}-macos-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'tests/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-macos-

      - name: Run tests
        run: zig build test

  docker-build:
    name: Verify Docker build
    needs: fmt-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # GHA cache export for buildx requires actions: write.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (CPU-only, single model)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: agave:ci
          build-args: |
            ENABLE_CUDA=false
            ENABLE_VULKAN=false
            ENABLE_ROCM=false
            ENABLE_WEBGPU=false
            ENABLE_DEBUG=false
            ENABLE_QWEN35=false
            ENABLE_QWEN4EXP=false
            ENABLE_QWEN4_EXP=false
            ENABLE_GPT_OSS=false
            ENABLE_NEMOTRON_H=false
            ENABLE_NEMOTRON_NANO=false
            ENABLE_GLM4=false
            ENABLE_GEMMA4=false
            ENABLE_DIFFUSION_GEMMA=false
            ENABLE_DEEPSEEK4=false
            ENABLE_LLAMA4=false
            ENABLE_DFLASH2=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The compose file is the documented local entry point but nothing parsed
      # it: a syntax error or a bad healthcheck reached a developer's
      # `docker compose up` instead of a red check. `config` parses the file and
      # expands every ${VAR}, including the :? on AGAVE_API_KEY, so a value is
      # supplied here.
      - name: Validate docker-compose.yml
        env:
          AGAVE_API_KEY: ci-compose-validate
        run: docker compose config --quiet

      - name: Smoke test binary
        run: bash scripts/check-docker-image.sh agave:ci

  cross-compile-check:
    name: Cross-compilation matrix
    needs: fmt-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos
          # README documents both static musl builds; keep them compiling.
          - x86_64-linux-musl
          - aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ steps.zig.outputs.version }}-cross-${{ matrix.target }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-cross-${{ matrix.target }}-

      - name: Build for target
        run: bash scripts/build-cross-target.sh "${{ matrix.target }}"

  # wasm32-freestanding is a separate build step, so the cross-compile matrix
  # (which only varies -Dtarget) never touches it. Untested it rots: the
  # baseline wasm32 CPU has no 64-bit atomics, and a plain
  # std.atomic.Value(i64) anywhere in the graph is a compile error there.
  wasm-build:
    name: Build WASM module
    needs: fmt-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ steps.zig.outputs.version }}-wasm-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-wasm-

      - name: Build agave.wasm
        run: bash scripts/build-wasm.sh

  # Rebuild-and-compare check for committed kernel binaries (CUDA PTX).
  # These artifacts are @embedFile'd but NOT rebuilt by `zig build`, so a
  # kernel-source edit without regeneration ships stale GPU code (this has
  # already happened: committed all.ptx predates deltanet_recurrence.zig).
  # Blocking since the tree was regenerated (2026-08): PTX comes from the
  # pinned zig 0.16.0 nvptx backend, so fresh builds are byte-identical on
  # any runner. SPIR-V checking is local-only for now (needs
  # glslangValidator, see scripts/check-shader-artifacts.sh) because runner
  # glslang versions are not pinned and its output embeds the generator
  # version.
  kernel-artifacts:
    name: Kernel artifact freshness
    needs: fmt-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ steps.zig.outputs.version }}-ptx-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-ptx-

      - name: Compare committed PTX against fresh build
        run: scripts/check-shader-artifacts.sh --ptx-only

  fuzz-smoke:
    name: Fuzz smoke (parsers + API surfaces)
    needs: fmt-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ steps.zig.outputs.version }}-fuzz-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'tests/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-fuzz-

      - name: Run bounded fuzz pass
        # --fuzz=N runs coverage-guided mutation for N iterations then exits.
        # Focus on untrusted-input surfaces (JSON, GGUF, image, grammar, CLI).
        run: zig build test --fuzz=1000 --summary all

  # oxlint + tsc are configured in-tree but never ran on GitHub: the chat UI
  # and WASM shell could regress without a red check. Blocking. Every .tsx
  # source is linted; .oxlintrc.json ignorePatterns holds build outputs only,
  # and scripts/check-web-lint-scope.sh keeps that list from growing. The job
  # also runs the chat UI smoke test, so a bundle that no longer mounts is red
  # here rather than in a browser.
  lint-web:
    name: Lint and typecheck TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      # node_modules is not in the Zig cache, so without this every run
      # refetches the oxlint/tsc tree. Keyed on the lockfile so a dependency
      # bump still re-installs; the restore prefix covers branch checkouts that
      # did not touch it.
      - name: Cache JS dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # scripts/lint-web.sh is the single entry point, so this job and
      # `zig build lint-web` run the same rules, the same bun version check and
      # the same lint-scope ratchet. Raw `bun run lint` / `bun run typecheck`
      # here would let a check added to the script pass locally and never run
      # remotely.
      - name: oxlint, tsc, UI smoke test and lint-scope ratchet
        run: bash scripts/lint-web.sh

      # src/web/{app.js,style.css} and web/{shell.js,style.css,agave.js} are
      # committed bun + Tailwind outputs (embedded by the server, shipped as the
      # browser shell). tsc --noEmit passes on stale committed output, so
      # compare a fresh build byte for byte.
      - name: Committed web artifacts are fresh
        run: bash scripts/check-web-artifacts.sh

  # The build strips ReleaseFast so the binary should not carry the path or
  # the time it was built. Nothing measured that, so an absolute path in a
  # panic message or an @src().file would have shipped silently. This job
  # builds the same source twice, from two different directories, with
  # different prefixes, cache dirs, epochs, timezone and locale, and requires
  # the two binaries to be byte-identical. scripts/check-reproducible.sh is
  # the single entry point, so `zig build check-reproducible` runs the same
  # check locally.
  reproducible-build:
    name: Reproducible release binary
    needs: fmt-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig
        id: zig

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ steps.zig.outputs.version }}-repro-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**') }}
          restore-keys: zig-${{ steps.zig.outputs.version }}-repro-

      - name: Build twice and byte-compare
        run: scripts/check-reproducible.sh

  # The auxiliary Python (scripts/check-docs.py runs in docs-check, plus the
  # golden harness and tools/) had no analyzer: an undefined name or a leaked
  # file handle merged unseen, and unformatted code accumulated. Blocking.
  # scripts/lint-python.sh is the single entry point, so the local `zig build
  # lint-python` and this job agree; both read the ruff.toml rule set and run
  # the same format check.
  lint-python:
    name: Lint Python
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scripts/lint-python.sh resolves the ruff.toml pin and runs it through
      # uvx. The runner image ships neither ruff nor uv (only pipx), so the job
      # used to fail before reading a single file. Install uv here and put its
      # shims on PATH; the ruff version stays pinned in ruff.toml alone.
      - name: Install uv
        run: |
          pipx install uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # scripts/lint-python.sh is the single entry point, so this job and
      # `zig build lint-python` run the same rules, the same ruff version and
      # the same paths. A raw `uvx ruff@<pin>` here would let a check added to
      # the script pass locally and never run remotely.
      - name: ruff
        run: bash scripts/lint-python.sh

  # Every script CI runs lives in scripts/ and lands here, so the shell this
  # workflow depends on is analysed by the gate that blocks it. Blocking.
  # scripts/lint-shell.sh is the single entry point, so the local `zig build
  # lint-shell` and this job run identical checks.
  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: bash scripts/lint-shell.sh

  # The stdlib unittest suites under scripts/ and tools/. They need no model
  # weights, no API key and no network, and until this job existed nothing
  # ran them, so a stale expectation sat unnoticed behind a green ci-pass.
  # scripts/test-python.sh is the single entry point, so `zig build
  # test-python` and this job run the same suites.
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's system python3 is 3.12, above the 3.11 floor the suites
      # are written for, so no setup-python step (and no unpinned action) here.
      - name: unittest
        run: bash scripts/test-python.sh

  ci-pass:
    name: CI passed
    if: always()
    needs: [fmt-check, test-linux-x86, test-macos, docker-build, cross-compile-check, wasm-build, fuzz-smoke, kernel-artifacts, reproducible-build, lint-web, lint-shell, lint-python, python-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      # The check is a repo script, so the job needs the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify all jobs passed
        # Env indirection, not ${{ }} interpolation: the job results must never
        # be spliced into a shell body. The check itself lives in
        # scripts/check-ci-pass.sh so the blocking lint-shell job analyses it.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/check-ci-pass.sh
