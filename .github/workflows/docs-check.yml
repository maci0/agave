name: Docs check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'build.zig.zon'
      - '.zigversion'
      - 'scripts/check-docs.py'
      - 'scripts/test_check_docs.py'
      - 'scripts/check-third-party-notices.py'
      - 'scripts/test_check_third_party_notices.py'
      - 'scripts/brand-glyphs.py'
      - 'THIRD_PARTY_NOTICES.md'
      - 'src/main.zig'
      - 'src/backend/metal.zig'
      - 'src/backend/cuda.zig'
      - 'src/backend/rocm.zig'
      - 'src/backend/vulkan.zig'
      - 'build.zig'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/**'
      - 'package.json'
      - 'scripts/check-shader-artifacts.sh'
      - '.dockerignore'
      - '.env.example'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'build.zig.zon'
      - '.zigversion'
      - 'scripts/check-docs.py'
      - 'scripts/test_check_docs.py'
      - 'scripts/check-third-party-notices.py'
      - 'scripts/test_check_third_party_notices.py'
      - 'scripts/brand-glyphs.py'
      - 'THIRD_PARTY_NOTICES.md'
      - 'src/main.zig'
      - 'src/backend/metal.zig'
      - 'src/backend/cuda.zig'
      - 'src/backend/rocm.zig'
      - 'src/backend/vulkan.zig'
      - 'build.zig'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/**'
      - 'package.json'
      - 'scripts/check-shader-artifacts.sh'
      - '.dockerignore'
      - '.env.example'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  # See ci.yml: cancel superseded PR runs, let a main run finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  LC_ALL: C
  TZ: UTC

jobs:
  check-docs:
    name: Link and count hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run docs checks
        run: python3 scripts/check-docs.py

      # Path filters above trigger on scripts/check-third-party-notices.py,
      # scripts/test_check_third_party_notices.py, package.json, bun.lock
      # inputs and THIRD_PARTY_NOTICES.md (DOCS_CHECK_PATH_INPUTS in
      # scripts/check-docs.py), so the gate that reads THIRD_PARTY_NOTICES.md
      # must run here too: the same entry point ci.yml fmt-check runs, so a
      # notices edit cannot be red in CI and green on docs-only pushes.
      - name: Third-party notices cover the shipped bundles
        run: python3 scripts/check-third-party-notices.py

      - name: Test the third-party notices checker
        run: python3 scripts/test_check_third_party_notices.py

      - name: Test the release SemVer guard
        run: python3 scripts/test_check_docs.py
