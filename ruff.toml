# Python lint config. The engine is Zig; this covers the auxiliary Python
# (scripts/, tests/, tools/, research/ references and kernel fixups), which
# had no analyzer at all before.
#
# Entry point: zig build lint-python  (scripts/lint-python.sh), same checks as
# the CI lint-python job: `ruff check` and `ruff format --check`, both at the
# pinned version. The tree is formatted, so the format check is a gate and not
# a suggestion; `ruff format` is the fixer for it.

# Ruff version gate. Both CI and scripts/lint-python.sh run the pinned ruff
# through uvx, except when a `ruff` on PATH already reports this version, so
# without the pin a new release can move the findings under an unchanged tree.
# Pinned the way .zigversion and package.json's packageManager pin are; a
# mismatched ruff fails before reading the tree.
required-version = "==0.16.4"

line-length = 120
target-version = "py311"
extend-exclude = [
    # Third-party tilelang prototype tree, kept close to upstream.
    "research/kernels/tilelang",
]

[lint]
# Bug-prone and correctness groups first, then simplification, then style.
select = [
    "F",    # pyflakes: dead code, undefined names
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear: real defect class
    "A",    # flake8-builtins: shadowing a builtin
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "FA",   # flake8-future-annotations: `from __future__ import annotations` where the runtime needs it
    "Q",    # flake8-quotes: one quote style, so a diff is never a re-quote
    "SLF",  # flake8-self: a private member reached from outside its class
    "RSE",  # flake8-raise: parens and other noise around a raised error
    "ASYNC", # flake8-async: a blocking or wrong-thread call inside an async body
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific
    "PT",   # flake8-pytest-style
    "ISC",  # implicit string concat
    "ICN",  # import conventions
    "TID",  # tidy-imports: no parent-relative imports that break as modules move
    "TCH",  # type-only imports belong under TYPE_CHECKING
    "T10",  # no leftover debugger calls (breakpoint, pdb, django shell)
    "PGH",  # pygrep-hooks: eval/exec and, in PGH004, bare `# noqa` with no rule
    "DTZ",  # datetime without an explicit tz is a wrong answer waiting to happen
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "PLE",  # pylint errors
    "PLW",  # pylint warnings: unchecked subprocess exit, loop-var reuse, globals
    # flake8-bandit, code by code. S603 (subprocess) and S607 (partial
    # executable path) are left off: every call in this tree runs a
    # repo-local binary or a test harness under a developer's control, so
    # the check is advisory there and would only ever be suppressed at
    # each site. The rest are real defect classes and the tree passes them.
    "S101", # assert used where a disabled-under -O check would vanish
    "S105", # hardcoded password
    "S106", # hardcoded password in argument
    "S110", # try/except/pass swallowing a failure
    "S112", # try/except/continue swallowing a failure
    "S301", # pickle deserialization of untrusted data
    "S310", # urlopen of an unaudited URL scheme
    "S324", # insecure hash function
    "S501", # request sending verify=False
    "S506", # yaml.load without SafeLoader
    "S602", # popen(shell=True)
    "S608", # SQL built by string formatting
]
ignore = [
    # Single-line `if cond: return x` early returns are the house style in the
    # reference scripts; splitting them is noise, not safety.
    "E701",
    # The test suites are unittest-based, not pytest.
    "PT009",
    "PT011",
    "PT012",
    "PT018",
    "PT027",
]

[lint.per-file-ignores]
# Math variable names (Q, K, V, Q_heads, HF_MODELS, ...) are the domain
# vocabulary of the reference implementations and kernels.
"research/**" = ["N803", "N806", "N812"]  # N812: torch convention is `import torch.nn.functional as F`
"tests/golden/**" = ["N803", "N806"]
